<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Wiki</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    /* Estilos específicos da Wiki integrados ao Design System Clean */
    .categoria-bloco {
      margin-bottom: 4px;
    }
    .categoria-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .categoria-header:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }
    .categoria-header.ativa {
      background: #1f212c;
      color: #ffffff;
    }
    .categoria-titulo-bloco {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .seta {
      font-size: 10px;
      color: var(--text-faint);
    }
    .contador-badge {
      font-size: 11px;
      color: var(--text-faint);
    }
    .categoria-itens {
      padding: 2px 0 6px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 8px;
      border-radius: var(--radius-xs);
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .item-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }
    .item-btn.ativo {
      color: var(--accent-coral);
      background: rgba(233, 69, 96, 0.08);
      font-weight: 600;
    }
    .sem-itens {
      font-size: 11.5px;
      color: var(--text-faint);
      padding: 4px 8px;
      font-style: italic;
    }

    /* Painel do Perfil */
    .painel-perfil {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 26px;
      box-shadow: var(--shadow-card);
    }
    .perfil-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      align-items: flex-start;
    }
    @media (max-width: 900px) {
      .perfil-layout { grid-template-columns: 1fr; }
    }
    .perfil-imagem {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: #111216;
    }
    .perfil-tag-categoria {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-yellow);
      margin-bottom: 6px;
    }
    .perfil-nome {
      margin: 0 0 10px 0;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .perfil-resumo {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .perfil-secao-titulo {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-faint);
      margin: 20px 0 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 4px;
    }
    .perfil-texto {
      color: var(--text-main);
      font-size: 13.5px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .tags-container, .relacoes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }
    .badge-tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      background: #20222e;
      border: 1px solid var(--border-card);
      color: var(--text-muted);
    }
    .badge-relacao {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: #1b2030;
      border: 1px solid #2d3855;
      color: #92b4f2;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .badge-relacao:hover {
      background: #27314d;
      color: #ffffff;
    }
    .campos-tabela {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }
    .campos-tabela th, .campos-tabela td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }
    .campos-tabela th {
      color: var(--text-muted);
      width: 30%;
      background: rgba(255, 255, 255, 0.02);
    }
    .perfil-acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb button {
      background: transparent;
      border: none;
      color: var(--accent-coral);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Unificada Geral -->
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <!-- Topbar com Ações da Wiki e Edição do Mundo -->
      <header class="app-topbar">
        <div class="app-topbar-title">
          <span>📖</span> <span id="topbar-titulo">Wiki</span>
        </div>
        <div class="app-topbar-actions">
          <button type="button" class="btn btn-secondary btn-sm" id="btn-editar-mundo" style="display:none;" title="Editar cenário, Mestre e regras do mundo">
            ⚙️ Editar Configuração do Mundo
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="nova-ficha">
            + Nova Ficha
          </button>
        </div>
      </header>

      <!-- Layout Interno da Wiki: Subnav de Categorias + Conteúdo -->
      <div class="wiki-wrapper">
        <aside class="wiki-subnav">
          <div class="wiki-subnav-title">Categorias</div>
          <div id="categorias"></div>
        </aside>

        <section class="wiki-content" id="conteudo-principal" aria-live="polite">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
            <div>
              <h2 id="titulo-categoria" style="margin:0; font-size:20px; color:#fff;">Personagens</h2>
              <p id="subtitulo" style="margin:4px 0 0; color:var(--text-muted); font-size:13px;">Fichas canônicas</p>
            </div>
          </div>
          <div id="fichas" class="grid-cards">Carregando fichas…</div>
        </section>
      </div>
    </main>
  </div>

  <!-- Dialog de Criação / Edição de Ficha da Wiki -->
  <dialog id="editor" class="clean-dialog">
    <form id="form-ficha">
      <div class="dialog-header">
        <h2 id="editor-titulo">Nova Ficha</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="fechar-editor">✕</button>
      </div>

      <div class="form-grid">
        <div style="display:grid; grid-template-columns: 1fr 2fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Tipo de Ficha</label>
            <select id="ficha-tipo" class="select-clean"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Título</label>
            <input id="ficha-titulo" class="input-clean" required maxlength="160" placeholder="Nome da entidade...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">URL da Imagem</label>
          <input id="ficha-imagem" class="input-clean" maxlength="2000" placeholder="https://exemplo.com/imagem.png">
        </div>

        <div class="form-group">
          <label class="form-label">Resumo Curto</label>
          <textarea id="ficha-resumo" class="textarea-clean" maxlength="1000" placeholder="Breve resumo visível em cards..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Conteúdo Completo (Lore & Detalhes)</label>
          <textarea id="ficha-conteudo" class="textarea-clean" style="min-height:140px;" maxlength="30000" placeholder="História detalhada, poderes, características..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Campos Estruturados (JSON opcional)</label>
          <textarea id="ficha-campos" class="textarea-clean" style="font-family:monospace; min-height:60px;" placeholder='{"região": "Norte", "periculosidade": "Alta"}'></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Tags (separadas por vírgula)</label>
          <input id="ficha-tags" class="input-clean" placeholder="Guerreiro, Humano, Nobre">
        </div>

        <div id="form-status" style="color:var(--accent-yellow); font-size:13px; min-height:18px;"></div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('editor').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Ficha</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog para Editar Configuração do Mundo (diretamente na página!) -->
  <dialog id="editor-mundo" class="clean-dialog">
    <form id="form-mundo">
      <div class="dialog-header">
        <h2>Editar Configuração do Mundo</h2>
        <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('editor-mundo').close()">✕</button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nome do Mundo</label>
          <input id="mundo-nome" class="input-clean" required maxlength="160">
        </div>
        <div class="form-group">
          <label class="form-label">Descrição Geral</label>
          <textarea id="mundo-descricao" class="textarea-clean" maxlength="4000"></textarea>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Nome do Mestre / Narrador</label>
            <input id="mundo-nome-mestre" class="input-clean" maxlength="80">
          </div>
          <div class="form-group">
            <label class="form-label">Foto do Mestre & Capa do Mundo (URL)</label>
            <input id="mundo-imagem-mestre" class="input-clean" maxlength="2000">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Cenário Inicial & Contexto</label>
          <textarea id="mundo-cenario" class="textarea-clean"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Personalidade do Mestre</label>
          <textarea id="mundo-personalidade" class="textarea-clean"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Primeira Mensagem</label>
          <textarea id="mundo-primeira" class="textarea-clean"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Diálogos de Exemplo</label>
          <textarea id="mundo-dialogos" class="textarea-clean"></textarea>
        </div>
        <div id="mundo-status" style="color:var(--accent-yellow); font-size:13px; min-height:18px;"></div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('editor-mundo').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Configuração do Mundo</button>
      </div>
    </form>
  </dialog>

  <script src="/static/sidebar.js"></script>
  <script>
    const tipos = [
      ['personagem', 'Personagens', 'Personagem'],
      ['local', 'Locais', 'Local'],
      ['raca', 'Raças', 'Raça'],
      ['item', 'Itens', 'Item'],
      ['organizacao', 'Organizações', 'Organização'],
      ['evento', 'Eventos', 'Evento'],
      ['criatura', 'Criaturas', 'Criatura'],
      ['divindade', 'Divindades', 'Divindade'],
      ['conceito', 'Conceitos', 'Conceito']
    ];

    const partes = window.location.pathname.split('/').filter(Boolean);
    const contexto = partes[0], escopoId = partes[1];
    const eMundo = contexto === 'mundos';

    let fichas = [];
    let tipoAtual = tipos[0][0];
    let fichaSelecionadaId = partes[3] || null;
    let fichaEditando = null;
    let categoriasExpandidas = { [tipoAtual]: true };
    let mundoDados = null;

    const esc = valor => {
      const el = document.createElement('span');
      el.textContent = valor == null ? '' : String(valor);
      return el.innerHTML;
    };

    function urlApi(sufixo = '') {
      return eMundo
        ? `/api/mundos/${encodeURIComponent(escopoId)}/fichas${sufixo}`
        : `/campanhas/${encodeURIComponent(escopoId)}/catalogo${sufixo}`;
    }

    async function inicializarTopo() {
      const topbarTitulo = document.getElementById('topbar-titulo');
      const subtitulo = document.getElementById('subtitulo');
      const btnEditarMundo = document.getElementById('btn-editar-mundo');

      if (eMundo) {
        btnEditarMundo.style.display = 'inline-flex';
        try {
          const resp = await fetch(`/api/mundos/${encodeURIComponent(escopoId)}`);
          if (resp.ok) {
            mundoDados = await resp.json();
            topbarTitulo.textContent = `Wiki: ${mundoDados.nome}`;
            subtitulo.textContent = `Fichas canônicas do mundo "${mundoDados.nome}".`;
          } else {
            topbarTitulo.textContent = 'Wiki do Mundo';
            subtitulo.textContent = 'Fichas canônicas do mundo.';
          }
        } catch {
          topbarTitulo.textContent = 'Wiki do Mundo';
        }
      } else {
        topbarTitulo.textContent = 'Wiki da Campanha';
        subtitulo.textContent = 'Fichas e acontecimentos registrados nesta campanha.';
      }
    }

    function abrirEditorMundo() {
      if (!mundoDados) return;
      const c = mundoDados.configuracao || {};
      document.getElementById('mundo-nome').value = mundoDados.nome || '';
      document.getElementById('mundo-descricao').value = mundoDados.descricao || '';
      document.getElementById('mundo-nome-mestre').value = c.nome_mestre || 'Mestre';
      document.getElementById('mundo-imagem-mestre').value = c.imagem_mestre || '';
      document.getElementById('mundo-cenario').value = c.cenario || '';
      document.getElementById('mundo-personalidade').value = c.personalidade || '';
      document.getElementById('mundo-primeira').value = c.primeira_mensagem || '';
      document.getElementById('mundo-dialogos').value = c.dialogos_exemplo || '';
      document.getElementById('mundo-status').textContent = '';
      document.getElementById('editor-mundo').showModal();
    }

    document.getElementById('btn-editar-mundo').onclick = abrirEditorMundo;

    document.getElementById('form-mundo').onsubmit = async e => {
      e.preventDefault();
      if (!mundoDados) return;
      const c = mundoDados.configuracao || {};
      const payload = {
        nome: document.getElementById('mundo-nome').value.trim(),
        descricao: document.getElementById('mundo-descricao').value.trim(),
        configuracao: {
          ...c,
          nome_mestre: document.getElementById('mundo-nome-mestre').value.trim() || 'Mestre',
          imagem_mestre: document.getElementById('mundo-imagem-mestre').value.trim(),
          cenario: document.getElementById('mundo-cenario').value.trim(),
          personalidade: document.getElementById('mundo-personalidade').value.trim(),
          primeira_mensagem: document.getElementById('mundo-primeira').value.trim(),
          dialogos_exemplo: document.getElementById('mundo-dialogos').value.trim()
        }
      };

      const resp = await fetch(`/api/mundos/${encodeURIComponent(escopoId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!resp.ok) {
        document.getElementById('mundo-status').textContent = 'Erro ao salvar alterações no mundo.';
        return;
      }

      mundoDados = await resp.json();
      document.getElementById('topbar-titulo').textContent = `Wiki: ${mundoDados.nome}`;
      document.getElementById('editor-mundo').close();
      alert('Configuração do mundo salva com sucesso!');
    };

    function toggleCategoria(tipoId) {
      categoriasExpandidas[tipoId] = !categoriasExpandidas[tipoId];
      tipoAtual = tipoId;
      renderizarSidebar();
    }

    function selecionarFicha(id) {
      fichaSelecionadaId = id;
      const f = fichas.find(item => item.id === id);
      if (f) {
        tipoAtual = f.tipo;
        categoriasExpandidas[f.tipo] = true;
      }
      renderizar();
    }

    function verGradeCategoria(tipoId) {
      tipoAtual = tipoId;
      fichaSelecionadaId = null;
      categoriasExpandidas[tipoId] = true;
      renderizar();
    }

    function renderizarSidebar() {
      const area = document.getElementById('categorias');
      area.innerHTML = tipos.map(([id, nomePlural]) => {
        const itensDaCategoria = fichas.filter(f => f.tipo === id);
        const contagem = itensDaCategoria.length;
        const expandida = !!categoriasExpandidas[id];
        const ehAtiva = tipoAtual === id;

        let itensHtml = '';
        if (expandida) {
          if (itensDaCategoria.length === 0) {
            itensHtml = `<div class="categoria-itens"><span class="sem-itens">Nenhuma ficha</span></div>`;
          } else {
            itensHtml = `<div class="categoria-itens">` +
              itensDaCategoria.map(f => {
                const ativo = f.id === fichaSelecionadaId ? ' ativo' : '';
                return `<button type="button" class="item-btn${ativo}" onclick="selecionarFicha('${esc(f.id)}')">${esc(f.titulo)}</button>`;
              }).join('') +
            `</div>`;
          }
        }

        return `<div class="categoria-bloco">
          <button type="button" class="categoria-header${ehAtiva ? ' ativa' : ''}" onclick="toggleCategoria('${id}')">
            <span class="categoria-titulo-bloco">
              <span class="seta">${expandida ? '▼' : '▶'}</span>
              <span>${esc(nomePlural)}</span>
            </span>
            <span class="contador-badge">(${contagem})</span>
          </button>
          ${itensHtml}
        </div>`;
      }).join('');
    }

    function renderizarPainelPerfil(ficha) {
      const [, nomePlural, nomeSingular] = tipos.find(([id]) => id === ficha.tipo) || [ficha.tipo, ficha.tipo, ficha.tipo];
      const main = document.getElementById('conteudo-principal');

      const tagsHtml = (ficha.tags || []).length > 0
        ? `<div class="tags-container">${ficha.tags.map(t => `<span class="badge-tag">${esc(t)}</span>`).join('')}</div>`
        : '';

      const camposEntries = Object.entries(ficha.campos || {});
      const camposHtml = camposEntries.length > 0
        ? `<h3 class="perfil-secao-titulo">Campos Estruturados</h3>
           <table class="campos-tabela">
             ${camposEntries.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</td></tr>`).join('')}
           </table>`
        : '';

      const nomesMap = new Map(fichas.map(f => [f.id, f.titulo]));
      const relacoesEntries = Object.entries(ficha.relacoes || {});
      const relacoesHtml = relacoesEntries.length > 0
        ? `<h3 class="perfil-secao-titulo">Relações</h3>
           <div class="relacoes-container">
             ${relacoesEntries.flatMap(([tipoRel, ids]) => ids.map(id => {
               const tituloDestino = nomesMap.get(id) || id;
               return `<button type="button" class="badge-relacao" onclick="selecionarFicha('${esc(id)}')">${esc(tipoRel)}: ${esc(tituloDestino)}</button>`;
             })).join('')}
           </div>`
        : '';

      const imagemHtml = ficha.imagem && ficha.imagem.trim()
        ? `<div class="perfil-col-imagem">
             <img class="perfil-imagem" src="${esc(ficha.imagem.trim())}" alt="${esc(ficha.titulo)}" onerror="this.style.display='none'">
           </div>`
        : '';

      main.innerHTML = `
        <div class="breadcrumb">
          <button type="button" onclick="verGradeCategoria('${esc(ficha.tipo)}')">${esc(nomePlural)}</button>
          <span>&gt;&gt;</span>
          <span style="color:#ffffff; font-weight:bold;">${esc(ficha.titulo)}</span>
        </div>

        <article class="painel-perfil">
          <div class="perfil-layout"${!ficha.imagem ? ' style="grid-template-columns:1fr;"' : ''}>
            ${imagemHtml}
            <div class="perfil-col-info">
              <span class="perfil-tag-categoria">${esc(nomeSingular)}</span>
              <h1 class="perfil-nome">${esc(ficha.titulo)}</h1>
              ${ficha.resumo ? `<p class="perfil-resumo">${esc(ficha.resumo)}</p>` : ''}
              ${tagsHtml}
              
              <h3 class="perfil-secao-titulo">Descrição</h3>
              <div class="perfil-texto">${esc(ficha.conteudo || 'Sem descrição detalhada.')}</div>

              ${camposHtml}
              ${relacoesHtml}
            </div>
          </div>

          <div class="perfil-acoes">
            <button type="button" class="btn btn-primary" id="btn-editar-ficha">Editar Ficha</button>
            <button type="button" class="btn btn-secondary" onclick="abrirEditor(null, '${esc(ficha.tipo)}')">+ Nova Ficha</button>
            <button type="button" class="btn btn-secondary" onclick="verGradeCategoria('${esc(ficha.tipo)}')">Ver Todas em Grade</button>
            <button type="button" class="btn btn-danger" id="btn-apagar-ficha">Apagar Ficha</button>
          </div>
        </article>
      `;

      document.getElementById('btn-editar-ficha').onclick = () => abrirEditor(ficha);
      document.getElementById('btn-apagar-ficha').onclick = () => apagarFicha(ficha.id);
    }

    function renderizarGrade() {
      const [, nomePlural] = tipos.find(([id]) => id === tipoAtual) || [tipoAtual, tipoAtual];
      const main = document.getElementById('conteudo-principal');

      main.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
          <div>
            <h2 id="titulo-categoria" style="margin:0; font-size:20px; color:#fff;">${esc(nomePlural)}</h2>
            <p id="subtitulo" style="margin:4px 0 0; color:var(--text-muted); font-size:13px;">${eMundo ? 'Fichas canônicas deste mundo.' : 'Fichas desta campanha.'}</p>
          </div>
        </div>
        <div id="fichas" class="grid-cards"></div>
      `;

      const fichasFiltradas = fichas.filter(f => f.tipo === tipoAtual);
      const container = document.getElementById('fichas');

      if (fichasFiltradas.length === 0) {
        container.innerHTML = `<div style="grid-column:1/-1; padding:28px; background:var(--bg-card); border:1px solid var(--border-card); border-radius:var(--radius-md); color:var(--text-muted); text-align:center;">Nenhuma ficha cadastrada nesta categoria. Clique em "+ Nova Ficha" para criar a primeira.</div>`;
        return;
      }

      container.innerHTML = fichasFiltradas.map(f => {
        const imgHtml = f.imagem && f.imagem.trim()
          ? `<img class="clean-card-img" src="${esc(f.imagem.trim())}" alt="${esc(f.titulo)}" onerror="this.style.display='none'">`
          : '';

        return `
          <article class="clean-card" style="cursor:pointer;" onclick="selecionarFicha('${esc(f.id)}')">
            ${imgHtml}
            <div class="clean-card-badge">${esc(f.tipo)}</div>
            <h3 class="clean-card-title">${esc(f.titulo)}</h3>
            <p class="clean-card-desc">${esc(f.resumo || (f.conteudo ? f.conteudo.slice(0, 120) + '...' : 'Sem resumo'))}</p>
            <div class="clean-card-actions" onclick="event.stopPropagation();">
              <button type="button" class="btn btn-primary btn-sm" onclick="selecionarFicha('${esc(f.id)}')">Ver Detalhes</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="abrirEditor(fichas.find(x => x.id === '${esc(f.id)}'))">Editar</button>
              <button type="button" class="btn btn-danger btn-sm" onclick="apagarFicha('${esc(f.id)}')">🗑️</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderizar() {
      renderizarSidebar();
      if (fichaSelecionadaId) {
        const f = fichas.find(item => item.id === fichaSelecionadaId);
        if (f) {
          renderizarPainelPerfil(f);
          return;
        }
      }
      renderizarGrade();
    }

    async function carregarFichas() {
      try {
        const resp = await fetch(urlApi());
        if (!resp.ok) throw new Error('Não foi possível carregar o catálogo de fichas.');
        fichas = await resp.json();
        renderizar();
      } catch (err) {
        document.getElementById('conteudo-principal').innerHTML = `<div style="color:var(--accent-coral); padding:20px;">${esc(err.message)}</div>`;
      }
    }

    function abrirEditor(ficha = null, tipoPadrao = null) {
      fichaEditando = ficha;
      document.getElementById('editor-titulo').textContent = ficha ? 'Editar Ficha' : 'Nova Ficha';
      
      const tipoSelect = document.getElementById('ficha-tipo');
      tipoSelect.innerHTML = tipos.map(([id, , nomeSingular]) => `<option value="${id}">${nomeSingular}</option>`).join('');

      tipoSelect.value = ficha ? ficha.tipo : (tipoPadrao || tipoAtual);
      document.getElementById('ficha-titulo').value = ficha ? ficha.titulo : '';
      document.getElementById('ficha-resumo').value = ficha ? (ficha.resumo || '') : '';
      document.getElementById('ficha-conteudo').value = ficha ? (ficha.conteudo || '') : '';
      document.getElementById('ficha-campos').value = ficha && ficha.campos ? JSON.stringify(ficha.campos, null, 2) : '';
      document.getElementById('ficha-imagem').value = ficha ? (ficha.imagem || '') : '';
      document.getElementById('ficha-tags').value = ficha && ficha.tags ? ficha.tags.join(', ') : '';
      document.getElementById('form-status').textContent = '';

      document.getElementById('editor').showModal();
    }

    document.getElementById('nova-ficha').onclick = () => abrirEditor(null, tipoAtual);
    document.getElementById('fechar-editor').onclick = () => document.getElementById('editor').close();

    document.getElementById('form-ficha').onsubmit = async evento => {
      evento.preventDefault();
      const statusEl = document.getElementById('form-status');
      let camposObj = {};
      const camposRaw = document.getElementById('ficha-campos').value.trim();
      if (camposRaw) {
        try {
          camposObj = JSON.parse(camposRaw);
        } catch {
          statusEl.textContent = 'Os campos estruturados devem ser um JSON válido.';
          return;
        }
      }

      const dados = {
        tipo: document.getElementById('ficha-tipo').value,
        titulo: document.getElementById('ficha-titulo').value.trim(),
        resumo: document.getElementById('ficha-resumo').value.trim(),
        conteudo: document.getElementById('ficha-conteudo').value.trim(),
        campos: camposObj,
        imagem: document.getElementById('ficha-imagem').value.trim(),
        tags: document.getElementById('ficha-tags').value.split(',').map(t => t.trim()).filter(Boolean)
      };

      const url = fichaEditando ? urlApi(`/${encodeURIComponent(fichaEditando.id)}`) : urlApi();
      const metodo = fichaEditando ? 'PUT' : 'POST';

      const resp = await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      if (!resp.ok) {
        const erro = await resp.json().catch(() => ({}));
        statusEl.textContent = erro.detail || 'Erro ao salvar ficha.';
        return;
      }

      const fichaSalva = await resp.json();
      document.getElementById('editor').close();
      await carregarFichas();
      selecionarFicha(fichaSalva.id);
    };

    async function apagarFicha(id) {
      const f = fichas.find(item => item.id === id);
      if (!confirm(`Tem certeza que deseja apagar a ficha "${f?.titulo || id}"?`)) return;

      const resp = await fetch(urlApi(`/${encodeURIComponent(id)}`), { method: 'DELETE' });
      if (!resp.ok) {
        alert('Não foi possível apagar a ficha.');
        return;
      }

      fichaSelecionadaId = null;
      await carregarFichas();
    }

    inicializarTopo();
    carregarFichas();
  </script>
</body>
</html>
