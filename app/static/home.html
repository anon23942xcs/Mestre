<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Campanhas</title>
  <style>
    :root { color-scheme: dark; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; }
    header { padding: 38px max(24px, calc((100vw - 1180px) / 2)); background: #16213e; border-bottom: 1px solid #345; }
    h1 { margin: 0; color: #e94560; } header p { color: #b8b8d1; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }
    .topo { display: flex; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .botao, .acao { display: inline-block; border: 0; border-radius: 5px; padding: 10px 14px; color: white; background: #e94560; text-decoration: none; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .ficha-card { display: flex; flex-direction: column; min-height: 210px; padding: 18px; background: #0f3460; border: 1px solid #244b77; border-radius: 8px; }
    .ficha-card:hover { border-color: #e94560; transform: translateY(-2px); }
    .card-link { color: inherit; text-decoration: none; flex: 1; } .card-link small { color: #f4d35e; }
    .card-link h2 { margin: 9px 0; font-size: 20px; } .card-link p { color: #ccd; line-height: 1.45; }
    .acoes { display: flex; gap: 8px; margin-top: 14px; } .acao.secundaria { background: transparent; color: #8fd694; border: 1px solid #8fd694; }
    .vazio, .erro { padding: 24px; border-radius: 8px; background: #16213e; color: #b8b8d1; } .erro { color: #ffabb5; }
    @media (max-width: 560px) { .topo { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header><h1>Mestre</h1><p>Escolha uma campanha ou comece uma nova aventura.</p></header>
  <main>
    <div class="topo"><h2>Suas campanhas</h2><a class="botao" href="/jogo">Criar nova campanha</a></div>
    <div id="campanhas" class="grid" aria-live="polite">Carregando campanhas…</div>
  </main>
  <script>
    function texto(valor) { return valor == null ? '' : String(valor); }
    function escapar(valor) { const el = document.createElement('span'); el.textContent = texto(valor); return el.innerHTML; }
    function resumo(campanha) {
      const lugar = campanha.local ? `Em ${campanha.local}` : 'Aventura em andamento';
      return `${lugar} · turno ${campanha.turno ?? 0}`;
    }
    async function carregarCampanhas() {
      const area = document.getElementById('campanhas');
      try {
        const resposta = await fetch('/campanhas');
        if (!resposta.ok) throw new Error('Não foi possível carregar as campanhas.');
        const campanhas = await resposta.json();
        if (!campanhas.length) {
          area.className = 'vazio';
          area.textContent = 'Ainda não há campanhas. Crie a primeira aventura para começar.';
          return;
        }
        area.innerHTML = campanhas.map(campanha => {
          const id = encodeURIComponent(campanha.campanha_id);
          const wiki = `/campanhas/${id}/wiki`;
          return `<article class="ficha-card">
            <a class="card-link" href="${wiki}" aria-label="Ver mundo de ${escapar(campanha.nome_jogador)}">
              <small>Campanha</small><h2>${escapar(campanha.nome_jogador || 'Sem nome')}</h2><p>${escapar(resumo(campanha))}</p>
            </a>
            <div class="acoes"><a class="acao" href="/jogo?campanha_id=${id}">Jogar</a><a class="acao secundaria" href="${wiki}">Ver mundo</a></div>
          </article>`;
        }).join('');
      } catch (erro) {
        area.className = 'erro'; area.textContent = erro.message;
      }
    }
    carregarCampanhas();
  </script>
</body>
</html>
