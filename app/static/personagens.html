<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Meus Personagens</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    .personagem-card-header {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .personagem-thumb {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      background: #252834;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
    }
    .personagem-info {
      flex: 1;
      min-width: 0;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="app-topbar-title">
          <span>👤</span> Meus Personagens
        </div>
        <div class="app-topbar-actions">
          <button class="btn btn-primary" id="novo">+ Novo Personagem</button>
        </div>
      </header>

      <div class="app-container">
        <p style="color:var(--text-muted); margin-top:0; margin-bottom:22px;">
          Crie e reutilize personagens em quantas campanhas quiser. Cada campanha receberá uma cópia independente.
        </p>

        <div id="lista" class="grid-cards" aria-live="polite">Carregando personagens…</div>
      </div>
    </main>
  </div>

  <!-- Dialog de Criação / Edição -->
  <dialog id="editor" class="clean-dialog">
    <form id="formulario">
      <div class="dialog-header">
        <h2 id="titulo-editor">Novo Personagem</h2>
        <button type="button" id="fechar" class="btn btn-secondary btn-sm">✕</button>
      </div>

      <div class="form-grid">
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Nome</label>
            <input id="nome" class="input-clean" required maxlength="80" placeholder="Ex: Valerius">
          </div>
          <div class="form-group">
            <label class="form-label">Idade</label>
            <input id="idade" class="input-clean" type="number" required min="1" max="200" value="20">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Gênero</label>
          <input id="genero" class="input-clean" required maxlength="40" placeholder="Ex: Masculino, Feminino, Não-binário">
        </div>

        <div class="form-group">
          <label class="form-label">Foto do Personagem (URL)</label>
          <input id="imagem" class="input-clean" maxlength="2000" placeholder="https://exemplo.com/foto.png">
        </div>

        <div class="form-group">
          <label class="form-label">Aparência</label>
          <textarea id="aparencia" class="textarea-clean" required maxlength="500" placeholder="Descreva traços marcantes, vestimentas, estatura..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Histórico Curto</label>
          <textarea id="historico" class="textarea-clean" maxlength="4000" placeholder="Origem e objetivos principais..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Ficha Completa (Markdown / Habilidades / Lore)</label>
          <textarea id="ficha_completa" class="textarea-clean" style="min-height:160px; font-family:monospace;" maxlength="20000" placeholder="Habilidades, regras próprias, história e lore..."></textarea>
        </div>

        <div id="status-form" style="color:var(--accent-yellow); font-size:13px; min-height:18px;"></div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('editor').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Personagem</button>
      </div>
    </form>
  </dialog>

  <script src="/static/sidebar.js"></script>
  <script>
    let personagens = [], editando = null;
    const esc = valor => {
      const el = document.createElement('span');
      el.textContent = valor == null ? '' : String(valor);
      return el.innerHTML;
    };

    async function carregar() {
      const area = document.getElementById('lista');
      try {
        const resposta = await fetch('/api/personagens');
        if (!resposta.ok) throw new Error('Não foi possível carregar os personagens.');
        personagens = await resposta.json();
        if (!personagens.length) {
          area.innerHTML = '<div style="grid-column: 1/-1; padding: 28px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-md); color: var(--text-muted); text-align: center;">Nenhum personagem cadastrado ainda. Clique em "+ Novo Personagem" para começar.</div>';
          return;
        }

        area.innerHTML = personagens.map(p => {
          const imgHtml = p.imagem && p.imagem.trim()
            ? `<img class="clean-card-img" src="${esc(p.imagem.trim())}" alt="${esc(p.nome)}" onerror="this.style.display='none'">`
            : '';

          return `
            <article class="clean-card">
              ${imgHtml}
              <div class="clean-card-badge">Personagem • ${esc(p.idade)} anos • ${esc(p.genero)}</div>
              <h2 class="clean-card-title">${esc(p.nome)}</h2>
              <p class="clean-card-desc"><strong>Aparência:</strong> ${esc(p.aparencia)}\n\n<strong>Histórico:</strong> ${esc(p.historico || 'Sem histórico')}</p>
              <div class="clean-card-actions">
                <a class="btn btn-primary btn-sm" href="/jogo?nova=1&personagem_id=${encodeURIComponent(p.id)}">Usar em Campanha</a>
                <button class="btn btn-secondary btn-sm editar" data-id="${esc(p.id)}">Editar</button>
                <button class="btn btn-danger btn-sm apagar" data-id="${esc(p.id)}">Apagar</button>
              </div>
            </article>
          `;
        }).join('');

        area.querySelectorAll('.editar').forEach(b => b.onclick = () => abrir(personagens.find(p => p.id === b.dataset.id)));
        area.querySelectorAll('.apagar').forEach(b => b.onclick = () => apagar(b.dataset.id));
      } catch (erro) {
        area.innerHTML = `<div style="grid-column: 1/-1; color: var(--accent-coral);">${esc(erro.message)}</div>`;
      }
    }

    function abrir(personagem = null) {
      editando = personagem;
      document.getElementById('titulo-editor').textContent = personagem ? 'Editar Personagem' : 'Novo Personagem';
      ['nome', 'idade', 'genero', 'aparencia', 'historico', 'ficha_completa', 'imagem'].forEach(c => {
        document.getElementById(c).value = personagem?.[c] ?? '';
      });
      document.getElementById('status-form').textContent = '';
      document.getElementById('editor').showModal();
    }

    document.getElementById('novo').onclick = () => abrir();
    document.getElementById('fechar').onclick = () => document.getElementById('editor').close();

    document.getElementById('formulario').onsubmit = async evento => {
      evento.preventDefault();
      const dados = {
        nome: document.getElementById('nome').value.trim(),
        idade: Number(document.getElementById('idade').value),
        genero: document.getElementById('genero').value.trim(),
        imagem: document.getElementById('imagem').value.trim(),
        aparencia: document.getElementById('aparencia').value.trim(),
        historico: document.getElementById('historico').value.trim(),
        ficha_completa: document.getElementById('ficha_completa').value.trim()
      };

      const resposta = await fetch(editando ? `/api/personagens/${encodeURIComponent(editando.id)}` : '/api/personagens', {
        method: editando ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      if (!resposta.ok) {
        const erro = await resposta.json().catch(() => ({}));
        document.getElementById('status-form').textContent = erro.detail || 'Não foi possível salvar o personagem.';
        return;
      }

      document.getElementById('editor').close();
      await carregar();
    };

    async function apagar(id) {
      const p = personagens.find(i => i.id === id);
      if (!confirm(`Apagar "${p?.nome || 'este personagem'}"? Campanhas já criadas não serão afetadas.`)) return;
      const resposta = await fetch(`/api/personagens/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (!resposta.ok) {
        alert('Não foi possível apagar o personagem.');
        return;
      }
      await carregar();
    }

    carregar();
  </script>
</body>
</html>
