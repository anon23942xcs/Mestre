<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Ficha</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    .ficha-card-view {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 30px;
      margin-top: 16px;
      box-shadow: var(--shadow-card);
    }
    .ficha-img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin: 16px 0;
      border: 1px solid var(--border-subtle);
      background: #111216;
    }
    .campos-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13.5px;
    }
    .campos-table th, .campos-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }
    .campos-table th {
      color: var(--text-muted);
      width: 28%;
      background: rgba(255, 255, 255, 0.02);
    }
    .tags-wrap, .relacoes-wrap {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .tag-item {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      background: #20222e;
      border: 1px solid var(--border-card);
      color: var(--text-muted);
    }
    .relacao-link {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: #1b2030;
      border: 1px solid #2d3855;
      color: #92b4f2;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .relacao-link:hover {
      background: #27314d;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="app-topbar-title">
          <span>📜</span> <span id="topbar-titulo">Ficha</span>
        </div>
        <div class="app-topbar-actions">
          <a class="btn btn-secondary btn-sm" id="voltar" href="/">← Voltar para a Wiki</a>
          <button class="btn btn-primary btn-sm" id="editar-btn" style="display:none;">Editar Ficha</button>
        </div>
      </header>

      <div class="app-container">
        <div id="conteudo" aria-live="polite">Carregando ficha…</div>
      </div>
    </main>
  </div>

  <dialog id="editor" class="clean-dialog">
    <form id="form-ficha">
      <div class="dialog-header">
        <h2>Editar Ficha</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="fechar-editor">✕</button>
      </div>

      <div class="form-grid">
        <div style="display:grid; grid-template-columns: 1fr 2fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select id="ficha-tipo" class="select-clean"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Título</label>
            <input id="ficha-titulo" class="input-clean" required maxlength="160">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">URL da Imagem</label>
          <input id="ficha-imagem" class="input-clean" maxlength="2000" placeholder="https://exemplo.com/foto.png">
        </div>

        <div class="form-group">
          <label class="form-label">Resumo</label>
          <textarea id="ficha-resumo" class="textarea-clean" maxlength="1000"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Conteúdo Completo</label>
          <textarea id="ficha-conteudo" class="textarea-clean" style="min-height:160px;" maxlength="30000"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Campos Estruturados (JSON)</label>
          <textarea id="ficha-campos" class="textarea-clean" style="font-family:monospace; min-height:60px;"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Tags (separadas por vírgula)</label>
          <input id="ficha-tags" class="input-clean">
        </div>

        <div id="form-status" style="color:var(--accent-yellow); font-size:13px; min-height:18px;"></div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('editor').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      </div>
    </form>
  </dialog>

  <script src="/static/sidebar.js"></script>
  <script>
    const tipos = [
      ['personagem', 'Personagem'],
      ['local', 'Local'],
      ['raca', 'Raça'],
      ['item', 'Item'],
      ['organizacao', 'Organização'],
      ['evento', 'Evento'],
      ['criatura', 'Criatura'],
      ['divindade', 'Divindade'],
      ['conceito', 'Conceito']
    ];

    const partes = window.location.pathname.split('/').filter(Boolean);
    const contexto = partes[0], escopoId = partes[1], fichaId = partes[3];
    const eMundo = contexto === 'mundos';
    let fichaAtual, catalogo = [];

    const esc = valor => {
      const el = document.createElement('span');
      el.textContent = valor == null ? '' : String(valor);
      return el.innerHTML;
    };

    const api = sufixo => eMundo
      ? `/api/mundos/${encodeURIComponent(escopoId)}/fichas${sufixo}`
      : `/campanhas/${encodeURIComponent(escopoId)}/catalogo${sufixo}`;

    document.getElementById('voltar').href = `/${contexto}/${encodeURIComponent(escopoId)}/wiki`;
    document.getElementById('ficha-tipo').innerHTML = tipos.map(([id, nome]) => `<option value="${id}">${nome}</option>`).join('');

    function valorCampo(valor) {
      return typeof valor === 'object' ? JSON.stringify(valor) : String(valor);
    }

    function renderizar() {
      const area = document.getElementById('conteudo');
      document.getElementById('topbar-titulo').textContent = `${fichaAtual.titulo} (${fichaAtual.tipo})`;
      document.getElementById('editar-btn').style.display = 'inline-flex';
      document.getElementById('editar-btn').onclick = abrirEditor;

      const campos = Object.entries(fichaAtual.campos || {}).map(([chave, valor]) =>
        `<tr><th>${esc(chave)}</th><td>${esc(valorCampo(valor))}</td></tr>`
      ).join('');

      const tags = (fichaAtual.tags || []).map(tag =>
        `<span class="tag-item">${esc(tag)}</span>`
      ).join('') || '<span style="color:var(--text-faint);">Sem tags.</span>';

      const nomes = new Map(catalogo.map(ficha => [ficha.id, ficha.titulo]));
      const relacoes = Object.entries(fichaAtual.relacoes || {}).flatMap(([tipo, ids]) =>
        ids.map(id => `<a class="relacao-link" href="/${contexto}/${encodeURIComponent(escopoId)}/wiki/${encodeURIComponent(id)}">${esc(tipo)}: ${esc(nomes.get(id) || id)}</a>`)
      ).join('') || '<span style="color:var(--text-faint);">Sem relações.</span>';

      const imgHtml = fichaAtual.imagem && fichaAtual.imagem.trim()
        ? `<img class="ficha-img" src="${esc(fichaAtual.imagem.trim())}" alt="${esc(fichaAtual.titulo)}" onerror="this.style.display='none'">`
        : '';

      area.innerHTML = `
        <article class="ficha-card-view">
          <div class="clean-card-badge">${esc(fichaAtual.tipo)}</div>
          <h1 style="margin:4px 0 10px 0; font-size:26px; color:#fff;">${esc(fichaAtual.titulo)}</h1>
          <p style="color:var(--text-muted); font-size:15px; margin:0 0 16px 0;">${esc(fichaAtual.resumo || 'Sem resumo.')}</p>
          ${imgHtml}
          
          <h3 class="perfil-secao-titulo" style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); margin:20px 0 8px 0; border-bottom:1px solid var(--border-subtle); padding-bottom:4px;">Conteúdo</h3>
          <div style="line-height:1.6; white-space:pre-wrap; color:var(--text-main); font-size:14px;">${esc(fichaAtual.conteudo || 'Sem conteúdo.')}</div>

          <h3 class="perfil-secao-titulo" style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); margin:20px 0 8px 0; border-bottom:1px solid var(--border-subtle); padding-bottom:4px;">Campos Estruturados</h3>
          ${campos ? `<table class="campos-table">${campos}</table>` : '<p style="color:var(--text-faint);">Sem campos estruturados.</p>'}

          <h3 class="perfil-secao-titulo" style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); margin:20px 0 8px 0; border-bottom:1px solid var(--border-subtle); padding-bottom:4px;">Tags</h3>
          <div class="tags-wrap">${tags}</div>

          <h3 class="perfil-secao-titulo" style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); margin:20px 0 8px 0; border-bottom:1px solid var(--border-subtle); padding-bottom:4px;">Relações</h3>
          <div class="relacoes-wrap">${relacoes}</div>

          <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border-subtle);">
            <button class="btn btn-primary" onclick="abrirEditor()">Editar Ficha</button>
          </div>
        </article>
      `;
    }

    async function carregar() {
      const area = document.getElementById('conteudo');
      try {
        const [respostaFicha, respostaCatalogo] = await Promise.all([
          fetch(api(`/${encodeURIComponent(fichaId)}`)),
          fetch(api(''))
        ]);
        if (!respostaFicha.ok) throw new Error(respostaFicha.status === 404 ? 'Ficha não encontrada.' : 'Não foi possível carregar a ficha.');
        fichaAtual = await respostaFicha.json();
        catalogo = respostaCatalogo.ok ? await respostaCatalogo.json() : [];
        renderizar();
      } catch (erro) {
        area.innerHTML = `<div style="color:var(--accent-coral);">${esc(erro.message)}</div>`;
      }
    }

    function abrirEditor() {
      document.getElementById('ficha-tipo').value = fichaAtual.tipo;
      document.getElementById('ficha-titulo').value = fichaAtual.titulo;
      document.getElementById('ficha-resumo').value = fichaAtual.resumo || '';
      document.getElementById('ficha-conteudo').value = fichaAtual.conteudo || '';
      document.getElementById('ficha-campos').value = JSON.stringify(fichaAtual.campos || {}, null, 2);
      document.getElementById('ficha-imagem').value = fichaAtual.imagem || '';
      document.getElementById('ficha-tags').value = (fichaAtual.tags || []).join(', ');
      document.getElementById('form-status').textContent = '';
      document.getElementById('editor').showModal();
    }

    document.getElementById('fechar-editor').onclick = () => document.getElementById('editor').close();

    document.getElementById('form-ficha').onsubmit = async evento => {
      evento.preventDefault();
      let campos;
      const status = document.getElementById('form-status');
      try {
        campos = JSON.parse(document.getElementById('ficha-campos').value || '{}');
      } catch {
        status.textContent = 'Os campos estruturados precisam ser um JSON válido.';
        return;
      }
      const dados = {
        tipo: document.getElementById('ficha-tipo').value,
        titulo: document.getElementById('ficha-titulo').value.trim(),
        resumo: document.getElementById('ficha-resumo').value.trim(),
        conteudo: document.getElementById('ficha-conteudo').value.trim(),
        campos,
        imagem: document.getElementById('ficha-imagem').value.trim(),
        tags: document.getElementById('ficha-tags').value.split(',').map(tag => tag.trim()).filter(Boolean)
      };
      const resposta = await fetch(api(`/${encodeURIComponent(fichaId)}`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      if (!resposta.ok) {
        const erro = await resposta.json().catch(() => ({}));
        status.textContent = erro.detail || 'Não foi possível salvar as alterações.';
        return;
      }
      document.getElementById('editor').close();
      await carregar();
    };

    carregar();
  </script>
</body>
</html>
