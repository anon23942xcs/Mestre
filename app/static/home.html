<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Início</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    .seletor-bloco {
      margin-top: 14px;
      padding: 12px;
      background: #14151c;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-card);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Unificada Geral -->
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="app-topbar-title">
          <span>🏠</span> Painel Principal
        </div>
        <div class="app-topbar-actions">
          <a class="btn btn-secondary btn-sm" href="/personagens">👤 Meus Personagens</a>
          <a class="btn btn-primary btn-sm" href="/mundos">+ Novo Mundo</a>
        </div>
      </header>

      <div class="app-container">
        <!-- Seção: Seus Mundos -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div>
            <h2 style="margin:0; font-size:20px; color:#fff;">Mundos Disponíveis</h2>
            <p style="margin:4px 0 0; color:var(--text-muted); font-size:13px;">Escolha um mundo canônico e um personagem para iniciar uma campanha.</p>
          </div>
          <a class="btn btn-secondary btn-sm" href="/mundos">Gerenciar Mundos →</a>
        </div>
        <div id="mundos" class="grid-cards" aria-live="polite">Carregando mundos…</div>

        <!-- Seção: Campanhas em Andamento -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:40px; margin-bottom:16px;">
          <div>
            <h2 style="margin:0; font-size:20px; color:#fff;">Campanhas em Andamento</h2>
            <p style="margin:4px 0 0; color:var(--text-muted); font-size:13px;">Continue suas sessões anteriores de onde parou.</p>
          </div>
        </div>
        <div id="campanhas" class="grid-cards" aria-live="polite">Carregando campanhas…</div>
      </div>
    </main>
  </div>

  <script src="/static/sidebar.js"></script>
  <script>
    let mundos = [];
    let personagens = [];
    let campanhas = [];

    const escapar = valor => {
      const el = document.createElement('span');
      el.textContent = valor == null ? '' : String(valor);
      return el.innerHTML;
    };

    function resumo(campanha) {
      if (!campanha) return 'Sem informações';
      const jogador = campanha.nome_jogador ? `Personagem: ${campanha.nome_jogador}` : 'Personagem sem nome';
      const local = campanha.local ? `Local: ${campanha.local}` : 'Local não informado';
      return `${jogador} • ${local}`;
    }

    function atualizarBotaoMundo(mundoId) {
      const select = document.getElementById(`sel-pers-${mundoId}`);
      const btn = document.getElementById(`btn-acao-${mundoId}`);
      if (!select || !btn) return;

      const persId = select.value;
      const campanhaExistente = campanhas.find(c => c.mundo_id === mundoId && c.personagem_id === persId);

      if (campanhaExistente) {
        btn.textContent = 'Continuar Jogo →';
        btn.className = 'btn btn-primary btn-sm';
        btn.dataset.modo = 'continuar';
        btn.dataset.campanhaId = campanhaExistente.campanha_id;
      } else {
        btn.textContent = 'Iniciar Nova Campanha';
        btn.className = 'btn btn-outline-green btn-sm';
        btn.dataset.modo = 'iniciar';
        delete btn.dataset.campanhaId;
      }
    }

    async function acaoBotaoMundo(mundoId) {
      const select = document.getElementById(`sel-pers-${mundoId}`);
      const btn = document.getElementById(`btn-acao-${mundoId}`);
      if (!select || !btn) return;

      const personagemId = select.value;
      if (!personagemId) {
        alert('Selecione ou crie um personagem antes de iniciar a campanha.');
        return;
      }

      if (btn.dataset.modo === 'continuar' && btn.dataset.campanhaId) {
        localStorage.setItem('mestre_campanha_id', btn.dataset.campanhaId);
        window.location.href = `/jogo?campanha_id=${encodeURIComponent(btn.dataset.campanhaId)}`;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Iniciando…';
      try {
        const resposta = await fetch('/campanhas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mundo_id: mundoId,
            personagem_id: personagemId,
            d10_atributos_jogador: {}
          })
        });
        if (!resposta.ok) {
          throw new Error('Não foi possível iniciar a campanha.');
        }
        const estado = await resposta.json();
        localStorage.setItem('mestre_campanha_id', estado.campanha_id);
        window.location.href = `/jogo?campanha_id=${encodeURIComponent(estado.campanha_id)}`;
      } catch (err) {
        alert(err.message || 'Erro ao iniciar campanha.');
        btn.disabled = false;
        atualizarBotaoMundo(mundoId);
      }
    }

    async function apagarCampanha(campanhaId, elementoBotao) {
      if (!confirm('Deseja realmente apagar esta campanha?')) return;
      try {
        const resposta = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}`, {
          method: 'DELETE'
        });
        if (!resposta.ok) throw new Error('Não foi possível apagar a campanha.');

        campanhas = campanhas.filter(c => c.campanha_id !== campanhaId);
        const card = elementoBotao.closest('.clean-card');
        if (card) card.remove();

        const areaCampanhas = document.getElementById('campanhas');
        if (!campanhas.length) {
          areaCampanhas.innerHTML = '<div style="grid-column:1/-1; padding:24px; background:var(--bg-card); border:1px solid var(--border-card); border-radius:var(--radius-md); color:var(--text-muted); text-align:center;">Nenhuma campanha ativa no momento.</div>';
        }

        mundos.forEach(m => atualizarBotaoMundo(m.id));
      } catch (err) {
        alert(err.message || 'Erro ao apagar campanha.');
      }
    }

    function renderizarCampanhas() {
      const area = document.getElementById('campanhas');
      if (!campanhas.length) {
        area.innerHTML = '<div style="grid-column:1/-1; padding:24px; background:var(--bg-card); border:1px solid var(--border-card); border-radius:var(--radius-md); color:var(--text-muted); text-align:center;">Nenhuma campanha ativa no momento.</div>';
        return;
      }

      area.innerHTML = campanhas.map(c => {
        const id = encodeURIComponent(c.campanha_id);
        const wiki = `/campanhas/${id}/wiki`;
        const mundo = c.mundo || 'Mundo não identificado';

        return `
          <article class="clean-card">
            <div class="clean-card-badge">${escapar(mundo)}</div>
            <h3 class="clean-card-title">${escapar(c.nome_jogador || 'Sem nome')}</h3>
            <p class="clean-card-desc">📍 <strong>Local:</strong> ${escapar(c.local || 'Inicial')}\n<strong>Jogador:</strong> ${escapar(c.nome_jogador)}</p>
            <div class="clean-card-actions">
              <a class="btn btn-primary btn-sm" href="/jogo?campanha_id=${id}">Jogar</a>
              <a class="btn btn-secondary btn-sm" href="${wiki}">Wiki</a>
              <button type="button" class="btn btn-danger btn-sm" onclick="apagarCampanha('${escapar(c.campanha_id)}', this)">🗑️</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderizarMundos() {
      const area = document.getElementById('mundos');
      if (!mundos.length) {
        area.innerHTML = '<div style="grid-column:1/-1; padding:24px; background:var(--bg-card); border:1px solid var(--border-card); border-radius:var(--radius-md); color:var(--text-muted); text-align:center;">Nenhum mundo criado ainda. Clique em "+ Novo Mundo" para criar.</div>';
        return;
      }

      const personagensPorData = [...personagens].sort((a, b) => {
        const dataA = a.data_criacao || '';
        const dataB = b.data_criacao || '';
        return dataB.localeCompare(dataA);
      });
      const maisRecenteId = personagensPorData[0]?.id || '';

      area.innerHTML = mundos.map(mundo => {
        const wikiUrl = `/mundos/${encodeURIComponent(mundo.id)}/wiki`;
        const campMundo = campanhas.find(c => c.mundo_id === mundo.id);
        let idPreselecionado = maisRecenteId;
        if (campMundo && campMundo.personagem_id && personagens.some(p => p.id === campMundo.personagem_id)) {
          idPreselecionado = campMundo.personagem_id;
        }

        let opcoesPersonagens = '';
        if (personagens.length > 0) {
          opcoesPersonagens = personagens.map(p => {
            const sel = p.id === idPreselecionado ? ' selected' : '';
            return `<option value="${escapar(p.id)}"${sel}>${escapar(p.nome)} (${escapar(p.genero)}, ${p.idade}a)</option>`;
          }).join('');
        } else {
          opcoesPersonagens = '<option value="">Nenhum personagem criado</option>';
        }

        const c = mundo.configuracao || {};
        const capaImg = c.imagem_mestre && c.imagem_mestre.trim()
          ? `<img class="clean-card-img" src="${escapar(c.imagem_mestre.trim())}" alt="${escapar(mundo.nome)}" onerror="this.style.display='none'">`
          : '';

        const nomeMestreStr = c.nome_mestre ? ` • Mestre: ${escapar(c.nome_mestre)}` : '';

        return `
          <article class="clean-card">
            ${capaImg}
            <div class="clean-card-badge">Mundo${nomeMestreStr}</div>
            <h3 class="clean-card-title">${escapar(mundo.nome)}</h3>
            <p class="clean-card-desc">${escapar(mundo.descricao || c.cenario || 'Sem descrição.')}</p>
            
            <div class="seletor-bloco">
              <label class="form-label" for="sel-pers-${escapar(mundo.id)}">Personagem para a aventura:</label>
              <select class="select-clean" id="sel-pers-${escapar(mundo.id)}" onchange="atualizarBotaoMundo('${escapar(mundo.id)}')">
                ${opcoesPersonagens}
              </select>
            </div>

            <div class="clean-card-actions">
              <button type="button" class="btn btn-primary btn-sm" id="btn-acao-${escapar(mundo.id)}" onclick="acaoBotaoMundo('${escapar(mundo.id)}')">
                Iniciar Campanha
              </button>
              <a class="btn btn-secondary btn-sm" href="${wikiUrl}">📖 Fichas / Wiki</a>
            </div>
          </article>
        `;
      }).join('');

      mundos.forEach(m => atualizarBotaoMundo(m.id));
    }

    async function inicializar() {
      try {
        const [resMundos, resCampanhas, resPers] = await Promise.all([
          fetch('/api/mundos'),
          fetch('/campanhas'),
          fetch('/api/personagens')
        ]);

        mundos = resMundos.ok ? await resMundos.json() : [];
        campanhas = resCampanhas.ok ? await resCampanhas.json() : [];
        personagens = resPers.ok ? await resPers.json() : [];

        renderizarMundos();
        renderizarCampanhas();
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    inicializar();
  </script>
</body>
</html>
