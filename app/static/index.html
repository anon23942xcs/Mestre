<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre — Campanha</title>
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        /* ─── Layout do Jogo / Campanha (Clean Antigravity) ─── */
        body {
            overflow: hidden;
            background: var(--bg-root);
        }

        .game-main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-root);
            overflow: hidden;
        }

        /* Topbar de Sessão */
        .session-topbar {
            height: 54px;
            min-height: 54px;
            background: var(--bg-topbar);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            z-index: 20;
        }
        .session-location {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: var(--text-main);
            font-weight: 500;
        }
        .session-location span.loc-name {
            font-weight: 600;
            color: #ffffff;
        }

        /* Stream de Mensagens com Scroll */
        .chat-stream-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }
        .chat-content-width {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Card de Mensagem */
        .chat-msg-card {
            display: flex;
            gap: 14px;
            width: 100%;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
            position: relative;
            transition: border-color 0.15s ease, transform 0.15s ease;
        }
        .chat-msg-card:hover {
            border-color: var(--border-card-hover);
        }
        .chat-msg-card.jogador {
            border-left: 3px solid var(--accent-green);
        }
        .chat-msg-card.mestre {
            border-left: 3px solid var(--accent-coral);
        }

        /* Avatar */
        .msg-avatar-wrap {
            flex-shrink: 0;
        }
        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: #191b24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
            overflow: hidden;
        }
        .msg-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        /* Conteúdo do Card */
        .msg-main {
            flex: 1;
            min-width: 0;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .msg-author-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .msg-author-name {
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
        }
        .msg-author-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }
        .msg-author-badge.user {
            color: var(--accent-green);
            background: rgba(143, 214, 148, 0.1);
            border-color: rgba(143, 214, 148, 0.25);
        }
        .msg-author-badge.bot {
            color: #ff8598;
            background: rgba(233, 69, 96, 0.1);
            border-color: rgba(233, 69, 96, 0.25);
        }

        /* Ações no Topo do Card */
        .msg-actions-top {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.35;
            transition: opacity 0.15s ease;
        }
        .chat-msg-card:hover .msg-actions-top {
            opacity: 1;
        }
        .icon-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-xs);
            font-size: 14px;
            line-height: 1;
            transition: all 0.15s ease;
        }
        .icon-action-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }
        .icon-action-btn.delete:hover {
            color: #ff7b90;
            background: rgba(233, 69, 96, 0.15);
        }

        /* Corpo da Mensagem */
        .msg-body {
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
        }
        .narrativa-paragrafo {
            margin: 0 0 10px 0;
        }
        .narrativa-paragrafo:last-child {
            margin-bottom: 0;
        }
        .fala {
            color: #a3cdff;
            font-weight: 500;
        }
        .pensamento {
            font-family: monospace;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: var(--radius-xs);
            color: var(--accent-yellow);
        }
        .chat-img-wrap {
            margin: 12px 0;
            text-align: center;
        }
        .chat-img {
            max-width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
        }

        /* Edição Inline */
        .msg-edit-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .msg-edit-textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            font-family: inherit;
            font-size: 13.5px;
            outline: none;
            resize: vertical;
        }
        .msg-edit-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Rodapé do Card (Regenerar) */
        .msg-footer {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
        }

        /* Typing Indicator */
        .typing-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            width: fit-content;
            animation: fadeIn 0.2s ease-in;
        }
        .typing-content {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .typing-author {
            font-weight: 600;
            color: #fff;
        }
        .dots-wave {
            display: inline-flex;
            gap: 2px;
        }
        .dots-wave span {
            animation: blinkDots 1.4s infinite both;
            font-weight: bold;
            color: var(--accent-coral);
            font-size: 16px;
            line-height: 1;
        }
        .dots-wave span:nth-child(2) { animation-delay: 0.2s; }
        .dots-wave span:nth-child(3) { animation-delay: 0.4s; }
        .dots-wave span:nth-child(4) { animation-delay: 0.6s; }

        @keyframes blinkDots {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* Rodapé Flutuante de Entrada (Estilo Antigravity) */
        .chat-input-wrapper {
            position: relative;
            padding: 12px 20px 20px;
            background: linear-gradient(180deg, rgba(14, 15, 19, 0) 0%, var(--bg-root) 35%);
            z-index: 10;
        }
        .chat-input-box {
            max-width: 860px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            box-shadow: var(--shadow-dialog);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.15s ease;
        }
        .chat-input-box:focus-within {
            border-color: var(--border-card-hover);
        }
        .chat-input-textarea {
            width: 100%;
            min-height: 48px;
            max-height: 220px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
        }
        .chat-input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            border-top: 1px solid var(--border-subtle);
        }
        .chat-input-author {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .chat-input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tela de Setup Inicial */
        .setup-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .setup-card {
            max-width: 480px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-dialog);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Unificada Geral -->
        <aside id="app-sidebar" class="app-sidebar"></aside>

        <!-- Área Principal -->
        <main class="game-main">
            <!-- TELA DE SETUP (Se nenhuma campanha iniciada) -->
            <div id="personagem-area" class="setup-screen" style="display:none;">
                <div class="setup-card">
                    <h2 style="margin:0 0 6px 0; font-size:22px; color:#fff;">Iniciar Campanha</h2>
                    <p style="margin:0 0 20px 0; color:var(--text-muted); font-size:13.5px;">
                        Escolha seu personagem e o mundo para entrar na aventura.
                    </p>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="personagem_id">Personagem</label>
                            <select id="personagem_id" class="select-clean"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="mundo_id">Mundo</label>
                            <select id="mundo_id" class="select-clean"></select>
                        </div>
                        <button class="btn btn-primary" onclick="criarPersonagem()" style="margin-top:10px; width:100%;">
                            Começar Aventura →
                        </button>
                    </div>
                </div>
            </div>

            <!-- TELA DE JOGO / SESSÃO ATIVA -->
            <div id="chat-area" style="display:none; flex-direction:column; flex:1; height:100vh; overflow:hidden;">
                <!-- Header Superior da Sessão -->
                <header class="session-topbar">
                    <div class="session-location">
                        <span>📍</span>
                        <span class="loc-name" id="header-local">Cena inicial</span>
                    </div>
                    <div class="app-topbar-actions">
                        <button class="btn btn-secondary btn-sm" id="btn-sincronizar-wiki" onclick="sincronizarWiki()" title="Sincronizar acontecimentos recentes com a Wiki e Fichas">
                            ⚡ Sincronizar Wiki
                        </button>
                    </div>
                </header>

                <!-- Stream do Chat -->
                <div class="chat-stream-container" id="chat-scroll-container">
                    <div class="chat-content-width" id="chat">
                        <!-- Mensagens renderizadas aqui -->
                    </div>
                </div>

                <!-- Barra de Entrada Flutuante (Estilo Antigravity) -->
                <footer class="chat-input-wrapper">
                    <div class="chat-input-box">
                        <textarea 
                            id="mensagem" 
                            class="chat-input-textarea" 
                            placeholder="Envie uma ação para o Mestre... (Enter para enviar, Shift+Enter para quebra de linha)"
                            onkeydown="tratarTeclaInput(event)"
                        ></textarea>
                        <div class="chat-input-footer">
                            <div class="chat-input-author">
                                <span>👤</span> <span id="label-nome-jogador">Jogador</span>
                            </div>
                            <div class="chat-input-actions">
                                <button id="btn-regenerar-rodape" class="btn btn-secondary btn-sm" onclick="regenerarUltimoTurno()" title="Regenerar última resposta do Mestre" style="display:none;">
                                    🔄 Regenerar
                                </button>
                                <button id="btn-enviar" class="btn btn-primary" onclick="enviarMensagem()">
                                    Enviar ↵
                                </button>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </main>
    </div>

    <!-- ─── MODAL DE FICHA DO JOGADOR (PARTE 2) ─── -->
    <dialog id="modal-ficha" class="clean-dialog" style="max-width:760px; max-height:88vh;">
        <div class="dialog-header">
            <h2 id="modal-title" style="margin:0; font-size:19px; color:#fff;">Ficha do Jogador na Campanha</h2>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn btn-secondary btn-sm" id="btn-toggle-modo-ficha" onclick="alternarModoEdicaoFicha()">
                    ✏️ Editar Ficha
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fecharFicha()">✕</button>
            </div>
        </div>

        <!-- MODO VISUALIZAÇÃO COMPLETA -->
        <div id="ficha-modo-visualizacao">
            <div id="ficha-conteudo-completo">Carregando ficha...</div>
        </div>

        <!-- MODO EDIÇÃO ATÔMICA DA CAMPANHA -->
        <div id="ficha-modo-edicao" style="display:none;">
            <form id="form-editar-jogador" onsubmit="salvarEdicaoJogadorCampanha(event)">
                <p style="color:var(--text-muted); font-size:12.5px; margin-top:0; margin-bottom:14px;">
                    ℹ️ <strong>Atenção:</strong> As alterações feitas aqui afetam SOMENTE esta campanha, preservando o molde reutilizável do personagem intacto.
                </p>

                <div class="form-grid">
                    <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px;">
                        <div class="form-group">
                            <label class="form-label">Nome</label>
                            <input id="edit-jog-nome" class="input-clean" required maxlength="80">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Idade</label>
                            <input id="edit-jog-idade" type="number" class="input-clean" min="1" max="200" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Gênero</label>
                            <input id="edit-jog-genero" class="input-clean" maxlength="40" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Foto do Personagem (URL)</label>
                        <input id="edit-jog-imagem" class="input-clean" maxlength="2000" placeholder="https://exemplo.com/foto.png">
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="form-group">
                            <label class="form-label">Pontos de Vida (PV Atual)</label>
                            <input id="edit-jog-pv" type="number" class="input-clean" min="0" max="10000" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Pontos de Vida Máximo (PV Máx)</label>
                            <input id="edit-jog-pv-max" type="number" class="input-clean" min="1" max="10000" required>
                        </div>
                    </div>

                    <div style="background:#15161f; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border-card);">
                        <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px;">Atributos Básicos</div>
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
                            <div class="form-group">
                                <label class="form-label">Força</label>
                                <input id="edit-jog-atr-forca" type="number" class="input-clean" value="5">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Destreza</label>
                                <input id="edit-jog-atr-destreza" type="number" class="input-clean" value="5">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Inteligência</label>
                                <input id="edit-jog-atr-inteligencia" type="number" class="input-clean" value="5">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Carisma</label>
                                <input id="edit-jog-atr-carisma" type="number" class="input-clean" value="5">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Aparência</label>
                        <textarea id="edit-jog-aparencia" class="textarea-clean" maxlength="500"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Histórico</label>
                        <textarea id="edit-jog-historico" class="textarea-clean" maxlength="4000"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Inventário (itens separados por vírgula)</label>
                        <input id="edit-jog-inventario" class="input-clean" placeholder="espada de ferro, ração de viagem, poção">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Ficha Completa (Markdown / Habilidades / Lore)</label>
                        <textarea id="edit-jog-ficha-completa" class="textarea-clean" style="min-height:140px; font-family:monospace;" maxlength="20000"></textarea>
                    </div>

                    <div id="status-salvar-jogador" style="color:var(--accent-yellow); font-size:13px; min-height:18px;"></div>
                </div>

                <div class="dialog-footer">
                    <button type="button" class="btn btn-secondary" onclick="alternarModoEdicaoFicha(false)">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-salvar-jog-campanha">Salvar na Campanha</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="/static/sidebar.js"></script>
    <script>
        const CHAVE_STORAGE = 'mestre_campanha_id';
        let campanhaId = null;
        let estadoAtual = null;
        let catalogoFichas = new Map();
        let estaGerando = false;

        const TIPOS_FICHA = new Set([
            'personagem', 'local', 'item', 'organizacao', 'evento',
            'raca', 'criatura', 'divindade', 'conceito'
        ]);

        async function carregarCatalogoCampanha(cid) {
            if (!cid) return;
            try {
                const resp = await fetch(`/campanhas/${encodeURIComponent(cid)}/catalogo`);
                if (!resp.ok) return;
                const fichas = await resp.json();
                catalogoFichas = new Map();
                if (Array.isArray(fichas)) {
                    fichas.forEach(f => {
                        if (f && f.id) catalogoFichas.set(f.id, f);
                    });
                }
            } catch (e) {
                console.warn('Não foi possível carregar o catálogo de fichas da campanha:', e);
            }
        }

        function resolverPlaceholders(texto, mapaFichas, nomeJogador) {
            if (!texto) return '';
            try {
                let res = String(texto);
                const nome = (nomeJogador && String(nomeJogador).trim()) ? String(nomeJogador).trim() : 'Jogador';

                res = res.replace(/\{\{\s*user\s*\}\}/gi, nome);

                const mapa = (mapaFichas instanceof Map)
                    ? mapaFichas
                    : (Array.isArray(mapaFichas) ? new Map(mapaFichas.map(f => [f.id, f])) : new Map());

                const regexPlaceholder = /\{\{\s*([a-zA-Z0-9_]+)\s*:\s*([^}:]+?)\s*(?::\s*([a-zA-Z0-9_]+)\s*)?\}\}/g;

                res = res.replace(regexPlaceholder, (match, tipo, id, modificador) => {
                    const tipoNorm = String(tipo).toLowerCase().trim();
                    const modNorm = modificador ? String(modificador).toLowerCase().trim() : '';
                    const idTrim = String(id).trim();

                    if (!TIPOS_FICHA.has(tipoNorm) && !mapa.has(idTrim)) {
                        return match;
                    }

                    let ficha = mapa.get(idTrim);
                    if (!ficha) {
                        for (const [k, v] of mapa.entries()) {
                            if (k.toLowerCase() === idTrim.toLowerCase()) {
                                ficha = v;
                                break;
                            }
                        }
                    }

                    if (modNorm === 'photo') {
                        if (ficha && ficha.imagem && typeof ficha.imagem === 'string' && ficha.imagem.trim().length > 0) {
                            const src = escapeHtml(ficha.imagem.trim());
                            const alt = escapeHtml(ficha.titulo || idTrim || 'Foto');
                            return `<img class="chat-img" src="${src}" alt="${alt}" onerror="this.style.display='none'">`;
                        }
                        return '';
                    }

                    if (ficha && ficha.titulo) {
                        return ficha.titulo;
                    }

                    return idTrim || '[desconhecido]';
                });

                return res;
            } catch (err) {
                console.warn('Erro ao resolver placeholders:', err);
                return String(texto);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await carregarPersonagens();
            await carregarMundos();

            const parametrosUrl = new URLSearchParams(window.location.search);
            const campanhaDaUrl = parametrosUrl.get('campanha_id');
            const novaAventura = parametrosUrl.get('nova');

            if (campanhaDaUrl) {
                campanhaId = campanhaDaUrl;
                localStorage.setItem(CHAVE_STORAGE, campanhaId);
            } else if (!novaAventura) {
                campanhaId = localStorage.getItem(CHAVE_STORAGE);
            }

            if (campanhaId && !novaAventura) {
                try {
                    const resp = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}`);
                    if (!resp.ok) {
                        localStorage.removeItem(CHAVE_STORAGE);
                        mostrarSetup();
                        return;
                    }
                    const estado = await resp.json();
                    estadoAtual = estado;
                    await carregarCatalogoCampanha(campanhaId);
                    mostrarAreaDeChat(estado);
                } catch (e) {
                    console.warn('Não foi possível retomar a campanha automaticamente:', e);
                    mostrarSetup();
                }
            } else {
                mostrarSetup();
            }
        });

        function mostrarSetup() {
            document.getElementById('personagem-area').style.display = 'flex';
            document.getElementById('chat-area').style.display = 'none';
        }

        async function carregarPersonagens() {
            try {
                const resp = await fetch('/api/personagens');
                const personagens = await resp.json();
                const seletor = document.getElementById('personagem_id');
                seletor.innerHTML = '';
                const parametrosUrl = new URLSearchParams(window.location.search);
                const personagemDaUrl = parametrosUrl.get('personagem_id');

                personagens.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.nome} (${p.genero}, ${p.idade} anos)`;
                    seletor.appendChild(opt);
                });

                if (personagemDaUrl && personagens.some(p => p.id === personagemDaUrl)) {
                    seletor.value = personagemDaUrl;
                }
                if (!personagens.length) {
                    seletor.innerHTML = '<option value="">Nenhum personagem cadastrado</option>';
                }
            } catch (_) {
                document.getElementById('personagem_id').innerHTML = '<option value="">Não foi possível carregar personagens</option>';
            }
        }

        async function carregarMundos() {
            try {
                const resp = await fetch('/api/mundos');
                const mundos = await resp.json();
                const seletor = document.getElementById('mundo_id');
                seletor.innerHTML = '';
                const parametrosUrl = new URLSearchParams(window.location.search);

                mundos.forEach(mundo => {
                    const opcao = document.createElement('option');
                    opcao.value = mundo.id;
                    opcao.textContent = mundo.nome;
                    seletor.appendChild(opcao);
                });
                const mundoDaUrl = parametrosUrl.get('mundo_id');
                if (mundoDaUrl && mundos.some(m => m.id === mundoDaUrl)) {
                    seletor.value = mundoDaUrl;
                }
                if (!mundos.length) seletor.innerHTML = '<option value="">Nenhum mundo cadastrado</option>';
            } catch (_) {
                document.getElementById('mundo_id').innerHTML = '<option value="">Não foi possível carregar mundos</option>';
            }
        }

        function tratarTeclaInput(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        }

        function renderizarCardMensagem(msg, ehUltima) {
            const card = document.createElement('div');
            card.className = `chat-msg-card ${msg.autor}`;
            card.id = `msg-card-${msg.id}`;
            card.setAttribute('data-id', msg.id);
            card.setAttribute('data-raw', msg.conteudo);

            const ehJogador = msg.autor === 'jogador';
            const nomeMestre = (estadoAtual?.configuracao_mundo?.nome_mestre || 'Mestre').trim() || 'Mestre';
            const nomeAutor = ehJogador ? escapeHtml(msg.nome || estadoAtual?.jogador?.nome || 'Jogador') : escapeHtml(nomeMestre);
            const inicial = nomeAutor.charAt(0).toUpperCase();

            let avatarHtml = '';
            if (ehJogador) {
                if (estadoAtual?.jogador?.imagem && estadoAtual.jogador.imagem.trim()) {
                    avatarHtml = `<img src="${encodeURI(estadoAtual.jogador.imagem.trim())}" alt="${nomeAutor}" class="msg-avatar-img" onerror="this.parentElement.innerHTML='<span>${inicial}</span>'">`;
                } else {
                    avatarHtml = `<span>${inicial}</span>`;
                }
            } else {
                if (estadoAtual?.configuracao_mundo?.imagem_mestre && estadoAtual.configuracao_mundo.imagem_mestre.trim()) {
                    avatarHtml = `<img src="${encodeURI(estadoAtual.configuracao_mundo.imagem_mestre.trim())}" alt="${nomeAutor}" class="msg-avatar-img" onerror="this.parentElement.innerHTML='<span style=\'font-size:18px;\'>🎲</span>'">`;
                } else {
                    avatarHtml = `<span style="font-size:18px;">🎲</span>`;
                }
            }

            const badgeHtml = ehJogador 
                ? `<span class="msg-author-badge user">Você</span>` 
                : `<span class="msg-author-badge bot">${nomeAutor}</span>`;

            const footerHtml = (ehUltima && !ehJogador) ? `
                <div class="msg-footer">
                    <button class="btn btn-secondary btn-sm" onclick="regenerarUltimoTurno()" title="Regenerar resposta">🔄 Regenerar</button>
                </div>
            ` : '';

            const conteudoFormatado = formatarNarracao(resolverPlaceholders(msg.conteudo, catalogoFichas, estadoAtual?.jogador?.nome));

            card.innerHTML = `
                <div class="msg-avatar-wrap">
                    <div class="msg-avatar">${avatarHtml}</div>
                </div>
                <div class="msg-main">
                    <div class="msg-header">
                        <div class="msg-author-row">
                            <span class="msg-author-name">${nomeAutor}</span>
                            ${badgeHtml}
                        </div>
                        <div class="msg-actions-top">
                            <button class="icon-action-btn delete" onclick="apagarMensagemECascata('${msg.id}')" title="Apagar esta mensagem e todas abaixo">🗑️</button>
                            <button class="icon-action-btn" onclick="iniciarEdicao('${msg.id}')" title="Editar mensagem">✏️</button>
                        </div>
                    </div>
                    <div class="msg-body" id="msg-body-${msg.id}">
                        ${conteudoFormatado}
                    </div>
                    ${footerHtml}
                </div>
            `;

            return card;
        }

        function mostrarAreaDeChat(estado) {
            estadoAtual = estado;
            document.getElementById('personagem-area').style.display = 'none';
            const chatArea = document.getElementById('chat-area');
            chatArea.style.display = 'flex';

            document.getElementById('header-local').textContent = estado.estado?.local || 'Aventura';

            // Atualiza sidebar global via helper do sidebar.js
            if (window.inicializarSidebar) {
                inicializarSidebar({ campanhaId: estado.campanha_id });
            }
            if (estado.jogador && window.atualizarSidebarJogador) {
                atualizarSidebarJogador(estado.jogador);
            }

            if (estado.jogador) {
                document.getElementById('label-nome-jogador').textContent = estado.jogador.nome || 'Jogador';
            }

            // Renderizar todo o histórico de mensagens
            const chat = document.getElementById('chat');
            chat.innerHTML = '';

            const historico = estado.historico_chat || [];

            if (historico.length === 0) {
                const primeiraMsg = estado.configuracao_mundo?.primeira_mensagem
                    ? resolverPlaceholders(estado.configuracao_mundo.primeira_mensagem, catalogoFichas, estado.jogador?.nome)
                    : (estado.ultima_narracao || 'A aventura começa.');
                const msgInicial = {
                    id: 'msg_ini',
                    autor: 'mestre',
                    nome: estado.configuracao_mundo?.nome_mestre || 'Mestre',
                    conteudo: primeiraMsg
                };
                chat.appendChild(renderizarCardMensagem(msgInicial, true));
            } else {
                historico.forEach((m, idx) => {
                    const ehUltima = (idx === historico.length - 1);
                    chat.appendChild(renderizarCardMensagem(m, ehUltima));
                });
            }

            atualizarBotaoRegenerarRodape();

            const container = document.getElementById('chat-scroll-container');
            container.scrollTop = container.scrollHeight;
        }

        function atualizarBotaoRegenerarRodape() {
            const btn = document.getElementById('btn-regenerar-rodape');
            if (!estadoAtual || !estadoAtual.historico_chat || estadoAtual.historico_chat.length < 2) {
                btn.style.display = 'none';
                return;
            }
            btn.style.display = 'inline-flex';
        }

        function mostrarIndicadorDigitando() {
            removerIndicadorDigitando();
            const chat = document.getElementById('chat');
            const autor = (estadoAtual?.configuracao_mundo?.nome_mestre || 'Mestre').trim() || 'Mestre';

            const wrap = document.createElement('div');
            wrap.className = 'typing-card';
            wrap.id = 'typing-indicator';

            let avatarHtml = '';
            if (estadoAtual?.configuracao_mundo?.imagem_mestre && estadoAtual.configuracao_mundo.imagem_mestre.trim()) {
                avatarHtml = `<img src="${encodeURI(estadoAtual.configuracao_mundo.imagem_mestre.trim())}" alt="${escapeHtml(autor)}" class="msg-avatar-img" onerror="this.parentElement.innerHTML='<span style=\'font-size:18px;\'>🎲</span>'">`;
            } else {
                avatarHtml = `<span style="font-size:18px;">🎲</span>`;
            }

            wrap.innerHTML = `
                <div class="msg-avatar-wrap">
                    <div class="msg-avatar">${avatarHtml}</div>
                </div>
                <div class="typing-content">
                    <span class="typing-author">${escapeHtml(autor)}</span>
                    <div class="dots-wave">
                        <span>.</span><span>.</span><span>.</span><span>.</span>
                    </div>
                </div>
            `;

            chat.appendChild(wrap);
            const container = document.getElementById('chat-scroll-container');
            container.scrollTop = container.scrollHeight;
        }

        function removerIndicadorDigitando() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function iniciarEdicao(msgId) {
            const card = document.getElementById(`msg-card-${msgId}`);
            if (!card) return;
            const raw = card.getAttribute('data-raw') || '';
            const body = document.getElementById(`msg-body-${msgId}`);

            body.innerHTML = `
                <div class="msg-edit-box">
                    <textarea class="msg-edit-textarea" id="edit-textarea-${msgId}">${escapeHtml(raw)}</textarea>
                    <div class="msg-edit-buttons">
                        <button class="btn btn-secondary btn-sm" onclick="cancelarEdicao('${msgId}')">Cancelar</button>
                        <button class="btn btn-primary btn-sm" onclick="salvarEdicao('${msgId}')">Salvar</button>
                    </div>
                </div>
            `;
            const ta = document.getElementById(`edit-textarea-${msgId}`);
            ta.focus();
        }

        function cancelarEdicao(msgId) {
            const card = document.getElementById(`msg-card-${msgId}`);
            if (!card) return;
            const raw = card.getAttribute('data-raw') || '';
            const body = document.getElementById(`msg-body-${msgId}`);
            body.innerHTML = formatarNarracao(resolverPlaceholders(raw, catalogoFichas, estadoAtual?.jogador?.nome));
        }

        async function salvarEdicao(msgId) {
            const ta = document.getElementById(`edit-textarea-${msgId}`);
            if (!ta) return;
            const novoTexto = ta.value.trim();
            if (!novoTexto) {
                alert('A mensagem não pode ser vazia.');
                return;
            }

            const card = document.getElementById(`msg-card-${msgId}`);
            card.setAttribute('data-raw', novoTexto);
            const body = document.getElementById(`msg-body-${msgId}`);
            body.innerHTML = formatarNarracao(resolverPlaceholders(novoTexto, catalogoFichas, estadoAtual?.jogador?.nome));

            if (campanhaId) {
                try {
                    await fetch(`/campanhas/${encodeURIComponent(campanhaId)}/mensagens/${encodeURIComponent(msgId)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conteudo: novoTexto })
                    });
                } catch (e) {
                    console.warn('Erro ao persistir edição no servidor:', e);
                }
            }
        }

        async function apagarMensagemECascata(msgId) {
            if (!confirm('Deseja apagar esta mensagem e todas as posteriores?')) {
                return;
            }
            if (!campanhaId) return;

            try {
                const resp = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}/mensagens/${encodeURIComponent(msgId)}`, {
                    method: 'DELETE'
                });
                if (!resp.ok) {
                    alert('Erro ao apagar mensagem.');
                    return;
                }
                const estado = await resp.json();
                estadoAtual = estado;
                mostrarAreaDeChat(estado);
            } catch (e) {
                alert('Erro de conexão ao apagar: ' + e.message);
            }
        }

        async function regenerarUltimoTurno() {
            if (!campanhaId || estaGerando) return;
            estaGerando = true;
            const btnRodape = document.getElementById('btn-regenerar-rodape');
            if (btnRodape) btnRodape.disabled = true;

            mostrarIndicadorDigitando();

            try {
                const resp = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}/regenerar`, {
                    method: 'POST'
                });
                removerIndicadorDigitando();
                if (!resp.ok) {
                    alert('Não foi possível regenerar o turno.');
                    return;
                }
                const dados = await resp.json();
                estadoAtual = dados.estado;
                mostrarAreaDeChat(dados.estado);
            } catch (e) {
                removerIndicadorDigitando();
                alert('Erro ao regenerar: ' + e.message);
            } finally {
                estaGerando = false;
                if (btnRodape) btnRodape.disabled = false;
            }
        }

        async function enviarMensagem() {
            if (estaGerando) return;

            const input = document.getElementById('mensagem');
            const btnEnviar = document.getElementById('btn-enviar');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            estaGerando = true;
            btnEnviar.disabled = true;

            const chat = document.getElementById('chat');
            const tempJogadorMsg = {
                id: 'temp_' + Date.now(),
                autor: 'jogador',
                nome: estadoAtual?.jogador?.nome || 'Jogador',
                conteudo: msg
            };
            chat.appendChild(renderizarCardMensagem(tempJogadorMsg, false));

            mostrarIndicadorDigitando();

            try {
                const resp = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}/acao`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mensagem: msg })
                });

                const dados = await resp.json();
                removerIndicadorDigitando();

                if (!resp.ok) {
                    alert('Erro: ' + (dados.detail || resp.status));
                    return;
                }

                estadoAtual = dados.estado;
                mostrarAreaDeChat(dados.estado);
            } catch (e) {
                removerIndicadorDigitando();
                alert('Erro ao processar ação: ' + e.message);
            } finally {
                estaGerando = false;
                btnEnviar.disabled = false;
                input.focus();
            }
        }

        /* ─── MODAL DA FICHA DO JOGADOR COMPLETA E EDITÁVEL ─── */
        let modoEdicaoFicha = false;

        function abrirFicha() {
            if (!estadoAtual || !estadoAtual.jogador) return;
            modoEdicaoFicha = false;
            alternarModoEdicaoFicha(false);
            renderizarVisualizacaoFicha();
            const modal = document.getElementById('modal-ficha');
            if (modal) modal.showModal();
        }
        window.abrirFichaModal = abrirFicha;

        function fecharFicha() {
            const modal = document.getElementById('modal-ficha');
            if (modal) modal.close();
        }

        function alternarModoEdicaoFicha(ativar = null) {
            modoEdicaoFicha = (ativar !== null) ? ativar : !modoEdicaoFicha;
            const viewEl = document.getElementById('ficha-modo-visualizacao');
            const editEl = document.getElementById('ficha-modo-edicao');
            const btnToggle = document.getElementById('btn-toggle-modo-ficha');

            if (modoEdicaoFicha) {
                viewEl.style.display = 'none';
                editEl.style.display = 'block';
                btnToggle.textContent = '👁️ Visualizar';
                preencherFormularioEdicaoJogador();
            } else {
                viewEl.style.display = 'block';
                editEl.style.display = 'none';
                btnToggle.textContent = '✏️ Editar Ficha';
                renderizarVisualizacaoFicha();
            }
        }

        function preencherFormularioEdicaoJogador() {
            const j = estadoAtual?.jogador;
            if (!j) return;
            document.getElementById('edit-jog-nome').value = j.nome || '';
            document.getElementById('edit-jog-idade').value = j.idade || 20;
            document.getElementById('edit-jog-genero').value = j.genero || '';
            document.getElementById('edit-jog-imagem').value = j.imagem || '';
            document.getElementById('edit-jog-pv').value = j.pv ?? 20;
            document.getElementById('edit-jog-pv-max').value = j.pv_max ?? 20;
            
            const atr = j.atributos || {};
            document.getElementById('edit-jog-atr-forca').value = atr.forca ?? 5;
            document.getElementById('edit-jog-atr-destreza').value = atr.destreza ?? 5;
            document.getElementById('edit-jog-atr-inteligencia').value = atr.inteligencia ?? 5;
            document.getElementById('edit-jog-atr-carisma').value = atr.carisma ?? 5;

            document.getElementById('edit-jog-aparencia').value = j.aparencia || '';
            document.getElementById('edit-jog-historico').value = j.historico || '';
            document.getElementById('edit-jog-inventario').value = (j.inventario || []).join(', ');
            document.getElementById('edit-jog-ficha-completa').value = j.ficha_completa || '';
            document.getElementById('status-salvar-jogador').textContent = '';
        }

        async function salvarEdicaoJogadorCampanha(e) {
            e.preventDefault();
            if (!campanhaId) return;
            const btnSalvar = document.getElementById('btn-salvar-jog-campanha');
            const statusEl = document.getElementById('status-salvar-jogador');
            btnSalvar.disabled = true;
            btnSalvar.textContent = 'Salvando...';

            const payload = {
                nome: document.getElementById('edit-jog-nome').value.trim(),
                idade: Number(document.getElementById('edit-jog-idade').value),
                genero: document.getElementById('edit-jog-genero').value.trim(),
                imagem: document.getElementById('edit-jog-imagem').value.trim(),
                pv: Number(document.getElementById('edit-jog-pv').value),
                pv_max: Number(document.getElementById('edit-jog-pv-max').value),
                atributos: {
                    forca: Number(document.getElementById('edit-jog-atr-forca').value),
                    destreza: Number(document.getElementById('edit-jog-atr-destreza').value),
                    inteligencia: Number(document.getElementById('edit-jog-atr-inteligencia').value),
                    carisma: Number(document.getElementById('edit-jog-atr-carisma').value)
                },
                aparencia: document.getElementById('edit-jog-aparencia').value.trim(),
                historico: document.getElementById('edit-jog-historico').value.trim(),
                inventario: document.getElementById('edit-jog-inventario').value.split(',').map(s => s.trim()).filter(Boolean),
                ficha_completa: document.getElementById('edit-jog-ficha-completa').value.trim()
            };

            try {
                const resp = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}/jogador`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    statusEl.textContent = err.detail || 'Erro ao salvar alterações.';
                    return;
                }

                estadoAtual = await resp.json();
                mostrarAreaDeChat(estadoAtual);
                alternarModoEdicaoFicha(false);
            } catch (err) {
                statusEl.textContent = 'Erro de rede: ' + err.message;
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = 'Salvar na Campanha';
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function formatarNarracao(textoBruto) {
            if (!textoBruto) return '';

            let textoProcessado = String(textoBruto);
            if (textoProcessado.includes('{{')) {
                textoProcessado = resolverPlaceholders(textoProcessado, catalogoFichas, estadoAtual?.jogador?.nome);
            }

            const blocos = textoProcessado.split(/\n{2,}/);

            return blocos.map(bloco => {
                let texto = bloco.trim();
                if (!texto) return '';

                const matchImagem = texto.match(/^!\[(.*?)\]\((https?:\/\/[^\s\)]+)\)$/);
                if (matchImagem) {
                    const alt = escapeHtml(matchImagem[1]);
                    const src = encodeURI(matchImagem[2]);
                    return `<div class="chat-img-wrap"><img src="${src}" alt="${alt}" class="chat-img" onerror="this.parentElement.style.display='none'"></div>`;
                }

                const tagsImg = [];
                texto = texto.replace(/<img\b[^>]*>/gi, (imgTag) => {
                    tagsImg.push(imgTag);
                    return `__SAFE_IMG_TOKEN_${tagsImg.length - 1}__`;
                });

                if (tagsImg.length === 1 && texto.trim() === '__SAFE_IMG_TOKEN_0__') {
                    return `<div class="chat-img-wrap">${tagsImg[0]}</div>`;
                }

                let seguro = escapeHtml(texto);

                seguro = seguro.replace(/!\[(.*?)\]\((https?:\/\/[^\s\)]+)\)/g, (m, alt, src) => {
                    return `<div class="chat-img-wrap"><img src="${src}" alt="${alt}" class="chat-img" onerror="this.parentElement.style.display='none'"></div>`;
                });

                seguro = seguro.replace(/`([^`]+)`/g, '<span class="pensamento">$1</span>');
                seguro = seguro.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
                seguro = seguro.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
                seguro = seguro.replace(/"([^"]+)"/g, '<span class="fala">&ldquo;$1&rdquo;</span>');
                seguro = seguro.replace(/\n/g, '<br>');

                tagsImg.forEach((imgTag, i) => {
                    seguro = seguro.replace(`__SAFE_IMG_TOKEN_${i}__`, imgTag);
                });

                return `<p class="narrativa-paragrafo">${seguro}</p>`;
            }).join('');
        }

        async function retomarCampanha(id) {
            const resp = await fetch(`/campanhas/${id}`);
            if (!resp.ok) {
                alert('Não foi possível carregar essa campanha.');
                return;
            }
            const estado = await resp.json();
            campanhaId = estado.campanha_id;
            localStorage.setItem(CHAVE_STORAGE, campanhaId);
            await carregarCatalogoCampanha(campanhaId);
            mostrarAreaDeChat(estado);
        }

        async function criarPersonagem() {
            const personagemId = document.getElementById('personagem_id').value;
            if (!personagemId) { alert('Escolha ou crie um personagem antes de iniciar a campanha.'); return; }
            const mundoId = document.getElementById('mundo_id').value;
            if (!mundoId) { alert('Escolha ou crie um mundo antes de iniciar a campanha.'); return; }
            const dados = {
                personagem_id: personagemId,
                mundo_id: mundoId,
                d10_atributos_jogador: {}
            };

            const resp = await fetch('/campanhas', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });

            if (!resp.ok) {
                alert('Erro ao criar campanha: ' + resp.status);
                return;
            }

            const estado = await resp.json();
            campanhaId = estado.campanha_id;
            localStorage.setItem(CHAVE_STORAGE, campanhaId);
            await carregarCatalogoCampanha(campanhaId);

            mostrarAreaDeChat(estado);
        }

        async function sincronizarWiki() {
            const btn = document.getElementById('btn-sincronizar-wiki');
            if (!campanhaId || (btn && btn.disabled)) return;

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '⚡ Sincronizando...';
            }

            try {
                const resp = await fetch(`/campanhas/${encodeURIComponent(campanhaId)}/sincronizar_wiki`, {
                    method: 'POST'
                });
                const dados = await resp.json();
                if (!resp.ok) {
                    alert('Erro ao sincronizar: ' + (dados.detail || resp.status));
                    return;
                }

                estadoAtual = dados.estado;
                await carregarCatalogoCampanha(campanhaId);
                mostrarAreaDeChat(dados.estado);

                let msgSucesso = `✨ Sincronização Canônica Concluída!\n\n${dados.resumo_alteracoes}`;
                if (dados.fichas_atualizadas && dados.fichas_atualizadas.length > 0) {
                    msgSucesso += `\n\nFichas Atualizadas: ${dados.fichas_atualizadas.join(', ')}`;
                }
                if (dados.fichas_novas && dados.fichas_novas.length > 0) {
                    msgSucesso += `\nFichas Criadas: ${dados.fichas_novas.join(', ')}`;
                }
                alert(msgSucesso);
            } catch (e) {
                alert('Erro de conexão ao sincronizar: ' + e.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '⚡ Sincronizar Wiki';
                }
            }
        }
    </script>
