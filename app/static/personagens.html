<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Meus personagens</title>
  <style>
    :root { color-scheme: dark; } * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; } header { padding: 30px max(24px, calc((100vw - 980px) / 2)); background: #16213e; border-bottom: 1px solid #345; } h1 { margin: 0; color: #e94560; } main { max-width: 980px; margin: auto; padding: 28px 24px 60px; } .topo { display: flex; gap: 12px; justify-content: space-between; align-items: center; } .botao { border: 0; border-radius: 5px; padding: 10px 14px; background: #e94560; color: white; text-decoration: none; cursor: pointer; font: inherit; } .secundario { background: transparent; border: 1px solid #8fd694; color: #8fd694; } .voltar { color: #f4d35e; font-size: 14px; } .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 24px; } .card { padding: 18px; background: #0f3460; border: 1px solid #244b77; border-radius: 8px; } .card h2 { margin: 7px 0; font-size: 20px; } .card small { color: #f4d35e; } .card p { color: #ccd; white-space: pre-wrap; font-size: 14px; } .acoes { display: flex; gap: 8px; margin-top: 16px; } .vazio, .erro { margin-top: 24px; padding: 22px; background: #16213e; border-radius: 8px; color: #b8b8d1; } .erro { color: #ffabb5; } dialog { width: min(680px, 94vw); border: 1px solid #e94560; border-radius: 9px; color: #eee; background: #16213e; padding: 24px; } dialog::backdrop { background: #000a; } form { display: grid; gap: 9px; } label { color: #b8b8d1; font-size: 13px; } input, textarea { width: 100%; padding: 9px; border: 1px solid #345; border-radius: 4px; background: #0f3460; color: white; font: inherit; } textarea { min-height: 75px; } #ficha_completa { min-height: 190px; font-family: monospace; } .form-acoes { display: flex; justify-content: flex-end; gap: 8px; } #status-form { color: #f4d35e; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <header><h1>Meus personagens</h1><p>Crie e reutilize personagens em quantas campanhas quiser.</p></header>
  <main><div class="topo"><a class="voltar" href="/">← Campanhas</a><button class="botao" id="novo">Novo personagem</button></div><div id="lista" class="grid" aria-live="polite">Carregando personagens…</div></main>
  <dialog id="editor"><form id="formulario"><div class="topo"><h2 id="titulo-editor">Novo personagem</h2><button type="button" id="fechar" class="botao secundario">Fechar</button></div><label>Nome<input id="nome" required maxlength="80"></label><label>Idade<input id="idade" type="number" required min="1" max="200"></label><label>Gênero<input id="genero" required maxlength="40"></label><label>Aparência<input id="aparencia" required maxlength="500"></label><label>Histórico<textarea id="historico" maxlength="4000"></textarea></label><label>Ficha completa<textarea id="ficha_completa" maxlength="20000" placeholder="Habilidades, regras próprias, história e lore…"></textarea></label><div id="status-form"></div><div class="form-acoes"><button class="botao" type="submit">Salvar personagem</button></div></form></dialog>
  <script>
    let personagens = [], editando = null; const esc = valor => { const el = document.createElement('span'); el.textContent = valor == null ? '' : String(valor); return el.innerHTML; };
    async function carregar() { const area = document.getElementById('lista'); try { const resposta = await fetch('/api/personagens'); if (!resposta.ok) throw new Error('Não foi possível carregar os personagens.'); personagens = await resposta.json(); if (!personagens.length) { area.className = 'vazio'; area.textContent = 'Nenhum personagem cadastrado ainda.'; return; } area.className = 'grid'; area.innerHTML = personagens.map(personagem => `<article class="card"><small>Personagem</small><h2>${esc(personagem.nome)}</h2><p>${esc(personagem.aparencia)}</p><p>${esc(personagem.historico || 'Sem histórico')}</p><div class="acoes"><a class="botao" href="/jogo?nova=1&personagem_id=${encodeURIComponent(personagem.id)}">Usar em campanha</a><button class="botao secundario editar" data-id="${esc(personagem.id)}">Editar</button><button class="botao secundario apagar" data-id="${esc(personagem.id)}">Apagar</button></div></article>`).join(''); area.querySelectorAll('.editar').forEach(botao => botao.onclick = () => abrir(personagens.find(personagem => personagem.id === botao.dataset.id))); area.querySelectorAll('.apagar').forEach(botao => botao.onclick = () => apagar(botao.dataset.id)); } catch (erro) { area.className = 'erro'; area.textContent = erro.message; } }
    function abrir(personagem = null) { editando = personagem; document.getElementById('titulo-editor').textContent = personagem ? 'Editar personagem' : 'Novo personagem'; ['nome','idade','genero','aparencia','historico','ficha_completa'].forEach(campo => document.getElementById(campo).value = personagem?.[campo] ?? ''); document.getElementById('status-form').textContent = ''; document.getElementById('editor').showModal(); }
    document.getElementById('novo').onclick = () => abrir(); document.getElementById('fechar').onclick = () => document.getElementById('editor').close();
    document.getElementById('formulario').onsubmit = async evento => { evento.preventDefault(); const dados = { nome: document.getElementById('nome').value.trim(), idade: Number(document.getElementById('idade').value), genero: document.getElementById('genero').value.trim(), aparencia: document.getElementById('aparencia').value.trim(), historico: document.getElementById('historico').value.trim(), ficha_completa: document.getElementById('ficha_completa').value.trim() }; const resposta = await fetch(editando ? `/api/personagens/${encodeURIComponent(editando.id)}` : '/api/personagens', {method: editando ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados)}); if (!resposta.ok) { const erro = await resposta.json().catch(() => ({})); document.getElementById('status-form').textContent = erro.detail || 'Não foi possível salvar o personagem.'; return; } document.getElementById('editor').close(); await carregar(); };
    async function apagar(id) { const personagem = personagens.find(item => item.id === id); if (!confirm(`Apagar “${personagem?.nome || 'este personagem'}”? Campanhas já criadas não serão afetadas.`)) return; const resposta = await fetch(`/api/personagens/${encodeURIComponent(id)}`, {method: 'DELETE'}); if (!resposta.ok) { alert('Não foi possível apagar o personagem.'); return; } await carregar(); }
    carregar();
  </script>
</body></html>
