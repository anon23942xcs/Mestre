<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mestre — Ficha</title>
  <style>
    :root { color-scheme: dark; } * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; } main { max-width: 920px; margin: auto; padding: 32px 24px 60px; } a { color: #8fd694; } .voltar { color: #f4d35e; } .ficha { margin-top: 22px; padding: 28px; border-radius: 10px; background: #16213e; } .tipo { color: #f4d35e; text-transform: capitalize; } h1 { color: #e94560; margin: 6px 0; } .resumo { color: #ccd; font-size: 18px; } .imagem { width: 100%; max-height: 380px; object-fit: cover; border-radius: 7px; margin: 14px 0; } .conteudo { line-height: 1.6; white-space: pre-wrap; } h2 { margin-top: 30px; color: #f4d35e; font-size: 19px; } table { width: 100%; border-collapse: collapse; } th, td { padding: 10px; text-align: left; border-bottom: 1px solid #345; } th { color: #b8b8d1; width: 32%; } .tags, .relacoes { display: flex; gap: 8px; flex-wrap: wrap; } .tag, .relacao { padding: 5px 9px; border-radius: 14px; background: #0f3460; } .botao { border: 0; border-radius: 5px; padding: 10px 14px; background: #e94560; color: white; cursor: pointer; font: inherit; } .vazio, .erro { margin-top: 24px; padding: 22px; border-radius: 8px; background: #16213e; color: #b8b8d1; } .erro { color: #ffabb5; } dialog { width: min(680px, 94vw); border: 1px solid #e94560; border-radius: 9px; color: #eee; background: #16213e; padding: 24px; } dialog::backdrop { background: #000a; } form { display: grid; gap: 8px; } label { color: #b8b8d1; font-size: 13px; } input, textarea, select { width: 100%; padding: 9px; border: 1px solid #345; border-radius: 4px; background: #0f3460; color: white; font: inherit; } textarea { min-height: 72px; } .form-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; } .secundario { background: transparent; border: 1px solid #8fd694; color: #8fd694; } #form-status { color: #f4d35e; font-size: 13px; }
  </style>
</head>
<body><main><a id="voltar" class="voltar" href="/">← Voltar para a Wiki</a><div id="conteudo" aria-live="polite">Carregando ficha…</div></main>
  <dialog id="editor"><form id="form-ficha"><div class="form-acoes"><button type="button" class="botao secundario" id="fechar-editor">Fechar</button></div><label>Tipo<select id="ficha-tipo"></select></label><label>Título<input id="ficha-titulo" required maxlength="160"></label><label>Resumo<textarea id="ficha-resumo" maxlength="1000"></textarea></label><label>Conteúdo<textarea id="ficha-conteudo" maxlength="30000"></textarea></label><label>Campos estruturados (JSON)<textarea id="ficha-campos"></textarea></label><label>URL da imagem<input id="ficha-imagem"></label><label>Tags (separadas por vírgula)<input id="ficha-tags"></label><div id="form-status"></div><div class="form-acoes"><button class="botao" type="submit">Salvar alterações</button></div></form></dialog>
  <script>
    const tipos = [['personagem','Personagem'],['local','Local'],['raca','Raça'],['item','Item'],['organizacao','Organização'],['evento','Evento'],['criatura','Criatura'],['divindade','Divindade'],['conceito','Conceito']]; const partes = window.location.pathname.split('/').filter(Boolean); const contexto = partes[0], escopoId = partes[1], fichaId = partes[3]; const eMundo = contexto === 'mundos'; let fichaAtual, catalogo = [];
    const esc = valor => { const el = document.createElement('span'); el.textContent = valor == null ? '' : String(valor); return el.innerHTML; }; const api = sufixo => eMundo ? `/api/mundos/${encodeURIComponent(escopoId)}/fichas${sufixo}` : `/campanhas/${encodeURIComponent(escopoId)}/catalogo${sufixo}`;
    document.getElementById('voltar').href = `/${contexto}/${encodeURIComponent(escopoId)}/wiki`; document.getElementById('ficha-tipo').innerHTML = tipos.map(([id,nome]) => `<option value="${id}">${nome}</option>`).join('');
    function valorCampo(valor) { return typeof valor === 'object' ? JSON.stringify(valor) : String(valor); }
    function renderizar() { const area = document.getElementById('conteudo'); const campos = Object.entries(fichaAtual.campos || {}).map(([chave, valor]) => `<tr><th>${esc(chave)}</th><td>${esc(valorCampo(valor))}</td></tr>`).join(''); const tags = (fichaAtual.tags || []).map(tag => `<span class="tag">${esc(tag)}</span>`).join('') || '<span>Sem tags.</span>'; const nomes = new Map(catalogo.map(ficha => [ficha.id, ficha.titulo])); const relacoes = Object.entries(fichaAtual.relacoes || {}).flatMap(([tipo, ids]) => ids.map(id => `<a class="relacao" href="/${contexto}/${encodeURIComponent(escopoId)}/wiki/${encodeURIComponent(id)}">${esc(tipo)}: ${esc(nomes.get(id) || id)}</a>`)).join('') || '<span>Sem relações.</span>'; area.innerHTML = `<article class="ficha"><div class="tipo">${esc(fichaAtual.tipo)}</div><h1>${esc(fichaAtual.titulo)}</h1><p class="resumo">${esc(fichaAtual.resumo || 'Sem resumo')}</p>${fichaAtual.imagem ? '<img class="imagem" id="imagem-ficha" alt="Imagem da ficha">' : ''}<div class="conteudo">${esc(fichaAtual.conteudo || 'Sem conteúdo.')}</div><h2>Campos</h2>${campos ? `<table>${campos}</table>` : '<p>Sem campos estruturados.</p>'}<h2>Tags</h2><div class="tags">${tags}</div><h2>Relações</h2><div class="relacoes">${relacoes}</div><p><button class="botao" id="editar">Editar</button></p></article>`; if (fichaAtual.imagem) document.getElementById('imagem-ficha').src = fichaAtual.imagem; document.getElementById('editar').onclick = abrirEditor; }
    async function carregar() { const area = document.getElementById('conteudo'); try { const [respostaFicha, respostaCatalogo] = await Promise.all([fetch(api(`/${encodeURIComponent(fichaId)}`)), fetch(api(''))]); if (!respostaFicha.ok) throw new Error(respostaFicha.status === 404 ? 'Ficha não encontrada.' : 'Não foi possível carregar a ficha.'); fichaAtual = await respostaFicha.json(); catalogo = respostaCatalogo.ok ? await respostaCatalogo.json() : []; renderizar(); } catch (erro) { area.className = 'erro'; area.textContent = erro.message; } }
    function abrirEditor() { document.getElementById('ficha-tipo').value = fichaAtual.tipo; document.getElementById('ficha-titulo').value = fichaAtual.titulo; document.getElementById('ficha-resumo').value = fichaAtual.resumo || ''; document.getElementById('ficha-conteudo').value = fichaAtual.conteudo || ''; document.getElementById('ficha-campos').value = JSON.stringify(fichaAtual.campos || {}, null, 2); document.getElementById('ficha-imagem').value = fichaAtual.imagem || ''; document.getElementById('ficha-tags').value = (fichaAtual.tags || []).join(', '); document.getElementById('form-status').textContent = ''; document.getElementById('editor').showModal(); }
    document.getElementById('fechar-editor').onclick = () => document.getElementById('editor').close(); document.getElementById('form-ficha').onsubmit = async evento => { evento.preventDefault(); let campos; const status = document.getElementById('form-status'); try { campos = JSON.parse(document.getElementById('ficha-campos').value || '{}'); } catch { status.textContent = 'Os campos estruturados precisam ser um JSON válido.'; return; } const dados = { tipo: document.getElementById('ficha-tipo').value, titulo: document.getElementById('ficha-titulo').value.trim(), resumo: document.getElementById('ficha-resumo').value.trim(), conteudo: document.getElementById('ficha-conteudo').value.trim(), campos, imagem: document.getElementById('ficha-imagem').value.trim(), tags: document.getElementById('ficha-tags').value.split(',').map(tag => tag.trim()).filter(Boolean) }; const resposta = await fetch(api(`/${encodeURIComponent(fichaId)}`), {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados)}); if (!resposta.ok) { const erro = await resposta.json().catch(() => ({})); status.textContent = erro.detail || 'Não foi possível salvar as alterações.'; return; } document.getElementById('editor').close(); await carregar(); };
    carregar();
  </script>
</body></html>
