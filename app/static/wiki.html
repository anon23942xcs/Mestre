<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre — Wiki</title>
  <style>
    :root { color-scheme: dark; } * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; }
    .layout { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; } aside { padding: 24px 16px; background: #16213e; border-right: 1px solid #345; }
    h1 { color: #e94560; font-size: 26px; margin: 0 0 4px; } .voltar { color: #f4d35e; font-size: 13px; } .categorias { margin-top: 28px; display: grid; gap: 5px; }
    .categoria { border: 0; background: transparent; color: #ccd; padding: 10px; text-align: left; border-radius: 5px; cursor: pointer; font-size: 15px; } .categoria:hover, .categoria.ativa { background: #0f3460; color: #fff; }
    main { padding: 30px; max-width: 1300px; width: 100%; } .cabecalho { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .botao { border: 0; border-radius: 5px; padding: 10px 14px; color: white; background: #e94560; cursor: pointer; font-size: 14px; } .botao.secundario { background: transparent; color: #8fd694; border: 1px solid #8fd694; }
    .catalogo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 22px 0; } .ficha-card { display: block; padding: 15px; border-radius: 7px; background: #0f3460; color: inherit; text-decoration: none; border: 1px solid transparent; } .ficha-card:hover { border-color: #e94560; } .ficha-card a { display: block; color: inherit; text-decoration: none; }
    .ficha-card small { color: #f4d35e; } .ficha-card h3 { margin: 7px 0; } .ficha-card p { color: #ccd; font-size: 14px; } .vazio, .erro { padding: 20px; background: #16213e; border-radius: 7px; color: #b8b8d1; } .erro { color: #ffabb5; }
    dialog { width: min(680px, 94vw); border: 1px solid #e94560; border-radius: 9px; color: #eee; background: #16213e; padding: 24px; } dialog::backdrop { background: #000a; } form { display: grid; gap: 8px; } label { color: #b8b8d1; font-size: 13px; margin-top: 5px; } input, textarea, select { width: 100%; padding: 9px; border: 1px solid #345; border-radius: 4px; background: #0f3460; color: white; font: inherit; } textarea { min-height: 72px; } .form-acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; } #form-status { min-height: 18px; color: #f4d35e; font-size: 13px; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #345; } .categorias { grid-template-columns: repeat(3, 1fr); margin-top: 14px; } main { padding: 20px; } }
  </style>
</head>
<body>
  <div class="layout"><aside><h1>Mestre</h1><a class="voltar" href="/">← Campanhas</a><div class="categorias" id="categorias"></div></aside>
    <main><div class="cabecalho"><div><h2 id="titulo-categoria">Personagens</h2><p id="subtitulo">Fichas canônicas do mundo.</p></div><button class="botao" id="nova-ficha">Nova ficha</button></div><div id="fichas" class="catalogo-grid" aria-live="polite">Carregando fichas…</div></main>
  </div>
  <dialog id="editor"><form id="form-ficha"><div class="cabecalho"><h2 id="editor-titulo">Nova ficha</h2><button type="button" class="botao secundario" id="fechar-editor">Fechar</button></div>
    <label>Tipo<select id="ficha-tipo"></select></label><label>Título<input id="ficha-titulo" required maxlength="160"></label><label>Resumo<textarea id="ficha-resumo" maxlength="1000"></textarea></label><label>Conteúdo<textarea id="ficha-conteudo" maxlength="30000"></textarea></label><label>Campos estruturados (JSON)<textarea id="ficha-campos" placeholder='{"região":"Norte"}'></textarea></label><label>URL da imagem<input id="ficha-imagem" maxlength="2000"></label><label>Tags (separadas por vírgula)<input id="ficha-tags"></label><div id="form-status"></div><div class="form-acoes"><button type="submit" class="botao">Salvar ficha</button></div></form></dialog>
  <script>
    const tipos = [['personagem','Personagens'],['local','Locais'],['raca','Raças'],['item','Itens'],['organizacao','Organizações'],['evento','Eventos'],['criatura','Criaturas'],['divindade','Divindades'],['conceito','Conceitos']];
    const partes = window.location.pathname.split('/').filter(Boolean); const campanhaId = partes[1]; let fichas = [], tipoAtual = tipos[0][0], fichaEditando = null;
    const esc = valor => { const el = document.createElement('span'); el.textContent = valor == null ? '' : String(valor); return el.innerHTML; };
    function urlApi(sufixo = '') { return `/campanhas/${encodeURIComponent(campanhaId)}/catalogo${sufixo}`; }
    function configurarCategorias() { const area = document.getElementById('categorias'); const select = document.getElementById('ficha-tipo'); select.innerHTML = tipos.map(([id,nome]) => `<option value="${id}">${nome}</option>`).join(''); area.innerHTML = tipos.map(([id,nome]) => `<button class="categoria" data-tipo="${id}">${nome}</button>`).join(''); area.addEventListener('click', evento => { const botao = evento.target.closest('[data-tipo]'); if (!botao) return; tipoAtual = botao.dataset.tipo; renderizar(); }); }
    function renderizar() { const [, nome] = tipos.find(([id]) => id === tipoAtual); document.getElementById('titulo-categoria').textContent = nome; document.querySelectorAll('.categoria').forEach(botao => botao.classList.toggle('ativa', botao.dataset.tipo === tipoAtual)); const area = document.getElementById('fichas'); const grupo = fichas.filter(ficha => ficha.tipo === tipoAtual); if (!grupo.length) { area.className = 'vazio'; area.textContent = `Nenhuma ficha de ${nome.toLowerCase()} ainda.`; return; } area.className = 'catalogo-grid'; area.innerHTML = grupo.map(ficha => `<article class="ficha-card"><a href="/campanhas/${encodeURIComponent(campanhaId)}/wiki/${encodeURIComponent(ficha.id)}"><small>${esc(nome.slice(0, -1) || nome)}</small><h3>${esc(ficha.titulo)}</h3><p>${esc(ficha.resumo || 'Sem resumo')}</p></a><button class="botao secundario editar-ficha" data-id="${esc(ficha.id)}">Editar</button></article>`).join(''); area.querySelectorAll('.editar-ficha').forEach(botao => botao.onclick = () => abrirEditor(fichas.find(ficha => ficha.id === botao.dataset.id))); }
    async function carregar() { const area = document.getElementById('fichas'); try { const resposta = await fetch(urlApi()); if (!resposta.ok) throw new Error(resposta.status === 404 ? 'Campanha não encontrada.' : 'Não foi possível carregar a Wiki.'); fichas = await resposta.json(); renderizar(); } catch (erro) { area.className = 'erro'; area.textContent = erro.message; } }
    function abrirEditor(ficha = null) { fichaEditando = ficha; document.getElementById('editor-titulo').textContent = ficha ? 'Editar ficha' : 'Nova ficha'; document.getElementById('ficha-tipo').value = ficha?.tipo || tipoAtual; document.getElementById('ficha-titulo').value = ficha?.titulo || ''; document.getElementById('ficha-resumo').value = ficha?.resumo || ''; document.getElementById('ficha-conteudo').value = ficha?.conteudo || ''; document.getElementById('ficha-campos').value = JSON.stringify(ficha?.campos || {}, null, 2); document.getElementById('ficha-imagem').value = ficha?.imagem || ''; document.getElementById('ficha-tags').value = (ficha?.tags || []).join(', '); document.getElementById('form-status').textContent = ''; document.getElementById('editor').showModal(); }
    document.getElementById('nova-ficha').onclick = () => abrirEditor(); document.getElementById('fechar-editor').onclick = () => document.getElementById('editor').close();
    document.getElementById('form-ficha').onsubmit = async evento => { evento.preventDefault(); let campos; const status = document.getElementById('form-status'); try { campos = JSON.parse(document.getElementById('ficha-campos').value || '{}'); } catch { status.textContent = 'Os campos estruturados precisam ser um JSON válido.'; return; } const dados = { tipo: document.getElementById('ficha-tipo').value, titulo: document.getElementById('ficha-titulo').value.trim(), resumo: document.getElementById('ficha-resumo').value.trim(), conteudo: document.getElementById('ficha-conteudo').value.trim(), campos, imagem: document.getElementById('ficha-imagem').value.trim(), tags: document.getElementById('ficha-tags').value.split(',').map(tag => tag.trim()).filter(Boolean) }; const resposta = await fetch(urlApi(fichaEditando ? `/${encodeURIComponent(fichaEditando.id)}` : ''), { method: fichaEditando ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados) }); if (!resposta.ok) { const erro = await resposta.json().catch(() => ({})); status.textContent = erro.detail || 'Não foi possível salvar a ficha.'; return; } document.getElementById('editor').close(); tipoAtual = dados.tipo; await carregar(); };
    configurarCategorias(); carregar();
  </script>
</body>
</html>
