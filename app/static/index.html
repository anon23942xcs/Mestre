<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mestre - RPG com IA</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
        .chat { background: #16213e; padding: 20px; border-radius: 10px; height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .msg-user { background: #0f3460; padding: 10px; margin: 5px 0; border-radius: 5px; text-align: right; }
        .msg-ia { background: #1a1a2e; padding: 10px; margin: 5px 0; border-radius: 5px; border-left: 3px solid #e94560; }
        .msg-teste { background: #16213e; padding: 6px 10px; margin: 5px 0; border-radius: 5px; font-size: 12px; color: #f4d35e; border-left: 3px solid #f4d35e; }
        .msg-erro { background: #3a1a1a; padding: 10px; margin: 5px 0; border-radius: 5px; border-left: 3px solid #e94560; font-size: 12px; }
        input, button, textarea { padding: 10px; font-size: 16px; border: none; border-radius: 5px; }
        input { flex: 1; background: #0f3460; color: white; }
        button { background: #e94560; color: white; cursor: pointer; margin-left: 10px; }
        .form-row { display: flex; }
        .status { margin-top: 10px; padding: 10px; background: #0f3460; border-radius: 5px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-text { flex: 1; }
        .btn-nova-aventura { background: transparent; border: 1px solid #e94560; color: #e94560; font-size: 12px; padding: 6px 10px; margin-left: 10px; }
        .login-form { background: #16213e; padding: 20px; border-radius: 10px; }
        .login-form input, .login-form textarea { width: 100%; margin-bottom: 5px; background: #0f3460; color: white; border: 1px solid #1a1a2e; }
        .login-form textarea { height: 60px; }
        .login-form textarea#ficha_completa { height: 220px; font-family: monospace; font-size: 13px; }
        .mundo-config { margin-top: 16px; border-top: 1px solid #345; padding-top: 8px; }
        details summary { color: #f4d35e; cursor: pointer; margin: 8px 0; }
        .login-form label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 3px; }
        .msg-ia em { font-style: italic; color: #b8b8d1; }
        .msg-confirmacao { background: #16213e; padding: 10px; margin: 5px 0; border-radius: 5px; font-size: 12px; color: #8fd694; border-left: 3px solid #8fd694; }
        .lista-campanhas { margin-top: 15px; }
        .campanha-item { background: #0f3460; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
        .campanha-item:hover { background: #16213e; border: 1px solid #e94560; }
        .link-toggle { color: #f4d35e; cursor: pointer; text-decoration: underline; font-size: 13px; display: inline-block; margin-top: 10px; }
        h1 { color: #e94560; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #16213e; padding: 30px; border-radius: 10px; max-width: 90%; max-height: 90%; overflow-y: auto; border: 2px solid #e94560; }
        .modal-content h3 { color: #f4d35e; margin-top: 0; }
        .modal-content pre { background: #0f3460; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px; color: #ddd; white-space: pre-wrap; word-wrap: break-word; }
        .modal-close { color: #e94560; cursor: pointer; font-size: 28px; font-weight: bold; position: absolute; top: 20px; right: 30px; }
        .modal-close:hover { color: #f4d35e; }
        .btn-ver-ficha { background: transparent; border: 1px solid #f4d35e; color: #f4d35e; font-size: 12px; padding: 6px 10px; cursor: pointer; margin-left: 10px; }
        .btn-catalogo { background: transparent; border: 1px solid #8fd694; color: #8fd694; font-size: 12px; padding: 6px 10px; cursor: pointer; margin-left: 10px; }
        .catalogo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 14px 0; }
        .ficha-card { background: #0f3460; padding: 12px; border-radius: 6px; }
        .ficha-card small { color: #f4d35e; display: block; margin-bottom: 5px; }
        .ficha-card h4 { margin: 3px 0; }
        .ficha-card p { font-size: 13px; color: #ccd; }
        .ficha-card button { font-size: 12px; padding: 5px 8px; margin: 2px 3px 0 0; }
        .catalogo-form input, .catalogo-form textarea, .catalogo-form select { width: 100%; box-sizing: border-box; margin: 4px 0 9px; background: #0f3460; color: white; border: 1px solid #345; padding: 8px; border-radius: 4px; }
        .catalogo-form textarea { min-height: 65px; font-family: inherit; }
    </style>
</head>
<body>
    <h1>Mestre</h1>
    <p><i>Motor de RPG com IA - Interface de Teste</i></p>

    <div id="personagem-area">
        <h3>Criar Personagem</h3>
        <div class="login-form">
            <input type="text" id="nome" placeholder="Nome">
            <input type="number" id="idade" placeholder="Idade">
            <input type="text" id="genero" placeholder="Gênero">
            <input type="text" id="aparencia" placeholder="Aparência">
            <textarea id="historico" placeholder="Histórico do personagem (resumo curto, opcional se preencher a ficha completa abaixo)"></textarea>
            <label for="ficha_completa">Ficha completa do personagem (opcional — cole aqui a ficha inteira, com habilidades, regras próprias, lore etc. Isso vai junto em toda narração, o personagem não é esquecido depois da criação.)</label>
            <textarea id="ficha_completa" placeholder="Cole aqui a ficha completa do personagem, se tiver uma..."></textarea>
            <details class="mundo-config">
                <summary>Configurar mundo (opcional)</summary>
                <label for="cenario">Cenário</label>
                <textarea id="cenario" placeholder="Onde e em que tom a história acontece?"></textarea>
                <label for="personalidade_mestre">Personalidade do Mestre</label>
                <textarea id="personalidade_mestre" placeholder="Como o narrador deve conduzir a história?"></textarea>
                <label for="primeira_mensagem">Primeira mensagem</label>
                <textarea id="primeira_mensagem" placeholder="A abertura da campanha"></textarea>
                <label for="dialogos_exemplo">Diálogos de exemplo</label>
                <textarea id="dialogos_exemplo" placeholder="Exemplos de tom, fala e formatação"></textarea>
                <label><input type="checkbox" id="sistema_rpg" checked style="width:auto;"> Usar sistema de RPG (dados, testes e PV)</label>
                <label for="sistema_id">Sistema de regras</label>
                <select id="sistema_id"><option value="d20">d20 clássico</option><option value="d10">d10 (pool oposto)</option><option value="nenhum">Narrativa pura</option></select>
                <label for="d10_limiar_sucesso">d10: limiar de sucesso</label>
                <select id="d10_limiar_sucesso"><option value="5">5 — fácil</option><option value="6" selected>6 — normal</option><option value="7">7 — difícil</option><option value="8">8 — muito difícil</option></select>
                <label>d10: orçamento de atributos (físico, social, mental)</label>
                <div class="form-row"><input type="number" id="d10_pontos_fisico" value="4" min="1" max="20" onchange="atualizarOpcoesD10()"><input type="number" id="d10_pontos_social" value="3" min="1" max="20" onchange="atualizarOpcoesD10()"><input type="number" id="d10_pontos_mental" value="2" min="1" max="20" onchange="atualizarOpcoesD10()"></div>
                <label>d10: distribuir atributos do personagem</label>
                <div class="form-row"><select id="d10_atributo_fisico"></select><select id="d10_atributo_social"></select><select id="d10_atributo_mental"></select></div>
            </details>
            <button onclick="criarPersonagem()" style="width:100%;">Iniciar Aventura</button>
        </div>
        <span class="link-toggle" onclick="alternarListaCampanhas()">Ver campanhas salvas</span>
        <div class="lista-campanhas" id="lista-campanhas" style="display:none;"></div>
    </div>

    <div id="chat-area" style="display:none;">
        <div class="chat" id="chat"></div>
        <div class="form-row">
            <input type="text" id="mensagem" placeholder="O que você faz?" onkeypress="if(event.key==='Enter') enviarMensagem()">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
        <div class="status">
            <span class="status-text" id="status">Aguardando ação...</span>
            <button class="btn-ver-ficha" id="btn-ficha" onclick="abrirFicha()" style="display:none;">📋 Ver Ficha</button>
            <button class="btn-catalogo" onclick="abrirCatalogo()">✦ Catálogo</button>
            <button class="btn-nova-aventura" onclick="novaAventura()">Nova Aventura</button>
        </div>
    </div>

    <div id="modal-catalogo" class="modal" onclick="if(event.target===this) fecharCatalogo()">
        <div class="modal-content" style="width:900px;">
            <span class="modal-close" onclick="fecharCatalogo()">&times;</span>
            <h3>Catálogo do mundo</h3>
            <p style="font-size:13px;color:#b8b8d1;">Fichas canônicas são persistentes e só entram na narração quando se tornam relevantes.</p>
            <div class="catalogo-grid" id="catalogo-lista"></div>
            <hr style="border-color:#345;">
            <h3 id="catalogo-form-titulo">Nova ficha</h3>
            <div class="catalogo-form">
                <select id="ficha-tipo"><option value="personagem">Personagem</option><option value="local">Local</option><option value="raca">Raça</option><option value="item">Item</option><option value="organizacao">Organização</option><option value="evento">Evento</option><option value="criatura">Criatura</option><option value="divindade">Divindade</option><option value="conceito">Conceito</option></select>
                <input id="ficha-titulo" placeholder="Título da ficha">
                <textarea id="ficha-resumo" placeholder="Resumo breve"></textarea>
                <textarea id="ficha-conteudo" placeholder="Conteúdo livre / Markdown"></textarea>
                <textarea id="ficha-campos" placeholder='Campos estruturados em JSON, ex.: {"região":"Norte", "perigo":3}'></textarea>
                <input id="ficha-imagem" placeholder="URL da imagem (opcional)">
                <input id="ficha-tags" placeholder="Tags separadas por vírgula">
                <button onclick="salvarFicha()">Salvar ficha</button>
                <button class="btn-nova-aventura" id="cancelar-edicao" onclick="limparFormularioFicha()" style="display:none;">Cancelar edição</button>
            </div>
        </div>
    </div>

    <div id="modal-ficha" class="modal" onclick="if(event.target===this) fecharFicha()">
        <div class="modal-content">
            <span class="modal-close" onclick="fecharFicha()">&times;</span>
            <h3 id="modal-title">Ficha Completa do Personagem</h3>
            <pre id="modal-ficha-content"></pre>
        </div>
    </div>

    <script>
        // Diferença chave em relação à versão anterior: o campanhaId agora é
        // persistido em localStorage, então recarregar a página (F5, fechar
        // e reabrir o navegador) não força a criação de um personagem novo.
        // O servidor continua sendo a fonte de verdade do estado — aqui só
        // guardamos QUAL campanha retomar.
        const CHAVE_STORAGE = 'mestre_campanha_id';
        let campanhaId = localStorage.getItem(CHAVE_STORAGE);
        let fichaEditando = null;

        function pontosD10() {
            return ['fisico', 'social', 'mental'].map(categoria =>
                parseInt(document.getElementById(`d10_pontos_${categoria}`).value) || 0
            );
        }

        function atualizarOpcoesD10() {
            const pontos = pontosD10();
            ['fisico', 'social', 'mental'].forEach((categoria, indice) => {
                const select = document.getElementById(`d10_atributo_${categoria}`);
                const anterior = select.value;
                select.innerHTML = pontos.map(ponto => `<option value="${ponto}">${ponto}</option>`).join('');
                select.value = pontos.includes(Number(anterior)) ? anterior : String(pontos[indice]);
            });
        }

        // Ao carregar a página, tenta retomar a campanha salva.
        window.addEventListener('DOMContentLoaded', async () => {
            if (!campanhaId) return;

            try {
                const resp = await fetch(`/campanhas/${campanhaId}`);
                if (!resp.ok) {
                    // Campanha não existe mais no servidor (ex: apagada, ou
                    // rodando contra um banco de dados diferente). Limpa o
                    // storage e deixa cair na tela de criação normalmente.
                    localStorage.removeItem(CHAVE_STORAGE);
                    campanhaId = null;
                    return;
                }
                const estado = await resp.json();
                mostrarAreaDeChat(estado, false);
            } catch (e) {
                // Servidor fora do ar ou erro de rede: não apaga o
                // localStorage, só deixa a tela de criação aparecer, já que
                // a campanha pode continuar existindo quando o servidor
                // voltar.
                console.warn('Não foi possível retomar a campanha automaticamente:', e);
            }
        });

        function mostrarAreaDeChat(estado, mensagemBemVindo) {
            document.getElementById('personagem-area').style.display = 'none';
            document.getElementById('chat-area').style.display = 'block';
            document.getElementById('status').innerHTML =
                `${estado.estado.local} - ${estado.estado.hora} | turno ${estado.turno}`;

            // Mostrar/esconder botão de ver ficha
            const btnFicha = document.getElementById('btn-ficha');
            if (estado.jogador.ficha_completa && estado.jogador.ficha_completa.trim().length > 0) {
                btnFicha.style.display = 'inline-block';
                // Guardar ficha no objeto global para usar no modal
                window.fichaAtual = estado.jogador.ficha_completa;
            } else {
                btnFicha.style.display = 'none';
            }

            const chat = document.getElementById('chat');
            if (mensagemBemVindo) {
                chat.innerHTML = `<div class="msg-ia">${formatarNarracao(estado.configuracao_mundo.primeira_mensagem)}</div>`;
                const tamanhoFicha = (estado.jogador.ficha_completa || '').length;
                if (tamanhoFicha > 0) {
                    chat.innerHTML += `<div class="msg-confirmacao">✓ Ficha completa salva (${tamanhoFicha} caracteres). Clique em "Ver Ficha" para visualizar. Ela vai junto em toda narração.</div>`;
                } else {
                    chat.innerHTML += `<div class="msg-confirmacao" style="color:#f4d35e;border-left-color:#f4d35e;">Nenhuma ficha completa foi enviada — só nome/aparência/histórico curto serão usados.</div>`;
                }
            } else {
                const cena = estado.ultima_narracao
                    ? formatarNarracao(estado.ultima_narracao)
                    : escapeHtml(`Campanha retomada. Você está em ${estado.estado.local}.`);
                chat.innerHTML = `<div class="msg-ia">${cena}</div>`;
            }
        }

        function abrirFicha() {
            if (window.fichaAtual) {
                document.getElementById('modal-ficha-content').textContent = window.fichaAtual;
                document.getElementById('modal-ficha').classList.add('active');
            }
        }

        function fecharFicha() {
            document.getElementById('modal-ficha').classList.remove('active');
        }

        async function abrirCatalogo() {
            document.getElementById('modal-catalogo').classList.add('active');
            await carregarCatalogo();
        }

        function fecharCatalogo() { document.getElementById('modal-catalogo').classList.remove('active'); }

        async function carregarCatalogo() {
            const lista = document.getElementById('catalogo-lista');
            lista.innerHTML = 'Carregando fichas...';
            try {
                const resp = await fetch(`/campanhas/${campanhaId}/catalogo`);
                const fichas = await resp.json();
                lista.innerHTML = '';
                if (!fichas.length) { lista.innerHTML = '<i>Nenhuma ficha criada ainda.</i>'; return; }
                fichas.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'ficha-card';
                    card.innerHTML = `<small>${escapeHtml(f.tipo)}</small><h4>${escapeHtml(f.titulo)}</h4><p>${escapeHtml(f.resumo || 'Sem resumo')}</p>`;
                    const editar = document.createElement('button'); editar.textContent = 'Editar'; editar.onclick = () => preencherFormularioFicha(f);
                    const apagar = document.createElement('button'); apagar.textContent = 'Apagar'; apagar.className = 'btn-nova-aventura'; apagar.onclick = () => apagarFicha(f.id, f.titulo);
                    card.append(editar, apagar); lista.appendChild(card);
                });
            } catch (e) { lista.innerHTML = 'Erro ao carregar o catálogo: ' + escapeHtml(e.message); }
        }

        function preencherFormularioFicha(ficha) {
            fichaEditando = ficha.id;
            document.getElementById('catalogo-form-titulo').textContent = 'Editar ficha';
            document.getElementById('ficha-tipo').value = ficha.tipo;
            document.getElementById('ficha-titulo').value = ficha.titulo;
            document.getElementById('ficha-resumo').value = ficha.resumo || '';
            document.getElementById('ficha-conteudo').value = ficha.conteudo || '';
            document.getElementById('ficha-campos').value = JSON.stringify(ficha.campos || {}, null, 2);
            document.getElementById('ficha-imagem').value = ficha.imagem || '';
            document.getElementById('ficha-tags').value = (ficha.tags || []).join(', ');
            document.getElementById('cancelar-edicao').style.display = 'inline-block';
        }

        function limparFormularioFicha() {
            fichaEditando = null;
            document.getElementById('catalogo-form-titulo').textContent = 'Nova ficha';
            ['ficha-titulo','ficha-resumo','ficha-conteudo','ficha-campos','ficha-imagem','ficha-tags'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('ficha-tipo').value = 'personagem';
            document.getElementById('cancelar-edicao').style.display = 'none';
        }

        async function salvarFicha() {
            let campos = {};
            try { campos = JSON.parse(document.getElementById('ficha-campos').value || '{}'); }
            catch (_) { alert('Os campos estruturados precisam ser um JSON válido.'); return; }
            const dados = {
                tipo: document.getElementById('ficha-tipo').value,
                titulo: document.getElementById('ficha-titulo').value.trim(),
                resumo: document.getElementById('ficha-resumo').value.trim(),
                conteudo: document.getElementById('ficha-conteudo').value.trim(), campos,
                imagem: document.getElementById('ficha-imagem').value.trim(),
                tags: document.getElementById('ficha-tags').value.split(',').map(t => t.trim()).filter(Boolean)
            };
            if (!dados.titulo) { alert('Dê um título à ficha.'); return; }
            const url = fichaEditando ? `/campanhas/${campanhaId}/catalogo/${fichaEditando}` : `/campanhas/${campanhaId}/catalogo`;
            const resp = await fetch(url, {method: fichaEditando ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(dados)});
            if (!resp.ok) { const erro = await resp.json(); alert(erro.detail || 'Não foi possível salvar a ficha.'); return; }
            limparFormularioFicha(); await carregarCatalogo();
        }

        async function apagarFicha(id, titulo) {
            if (!confirm(`Apagar a ficha “${titulo}”? Esta ação não pode ser desfeita.`)) return;
            const resp = await fetch(`/campanhas/${campanhaId}/catalogo/${id}`, {method: 'DELETE'});
            if (!resp.ok) { alert('Não foi possível apagar a ficha.'); return; }
            if (fichaEditando === id) limparFormularioFicha();
            await carregarCatalogo();
        }

        function novaAventura() {
            if (!confirm('Isso vai abandonar a campanha atual (ela continua salva no servidor, mas você vai criar um personagem novo). Continuar?')) {
                return;
            }
            localStorage.removeItem(CHAVE_STORAGE);
            campanhaId = null;
            document.getElementById('chat-area').style.display = 'none';
            document.getElementById('personagem-area').style.display = 'block';
            document.getElementById('chat').innerHTML = '';
            document.getElementById('nome').value = '';
            document.getElementById('idade').value = '';
            document.getElementById('genero').value = '';
            document.getElementById('aparencia').value = '';
            document.getElementById('historico').value = '';
            document.getElementById('ficha_completa').value = '';
            ['cenario', 'personalidade_mestre', 'primeira_mensagem', 'dialogos_exemplo'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('sistema_rpg').checked = true;
            document.getElementById('sistema_id').value = 'd20';
            document.getElementById('d10_limiar_sucesso').value = '6';
            document.getElementById('d10_pontos_fisico').value = '4';
            document.getElementById('d10_pontos_social').value = '3';
            document.getElementById('d10_pontos_mental').value = '2';
            atualizarOpcoesD10();
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Converte *texto* em <em>texto</em> DEPOIS de escapar o HTML, pra
        // renderizar de verdade as ações em itálico em vez de mostrar os
        // asteriscos crus, sem abrir brecha pra HTML/script injetado pela
        // IA ou pelo jogador.
        function formatarNarracao(texto) {
            return escapeHtml(texto).replace(/\*(.+?)\*/g, '<em>$1</em>');
        }

        async function alternarListaCampanhas() {
            const div = document.getElementById('lista-campanhas');
            if (div.style.display === 'block') {
                div.style.display = 'none';
                return;
            }
            div.style.display = 'block';
            div.innerHTML = 'Carregando...';
            try {
                const resp = await fetch('/campanhas');
                const campanhas = await resp.json();
                if (!campanhas.length) {
                    div.innerHTML = '<i>Nenhuma campanha salva ainda.</i>';
                    return;
                }
                div.innerHTML = '';
                campanhas.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'campanha-item';
                    item.innerHTML = `<span>${escapeHtml(c.nome_jogador)} — ${escapeHtml(c.local)} (turno ${c.turno})</span><span>retomar →</span>`;
                    item.onclick = () => retomarCampanha(c.campanha_id);
                    div.appendChild(item);
                });
            } catch (e) {
                div.innerHTML = 'Erro ao carregar campanhas: ' + e.message;
            }
        }

        async function retomarCampanha(id) {
            const resp = await fetch(`/campanhas/${id}`);
            if (!resp.ok) {
                alert('Não foi possível carregar essa campanha.');
                return;
            }
            const estado = await resp.json();
            campanhaId = estado.campanha_id;
            localStorage.setItem(CHAVE_STORAGE, campanhaId);
            mostrarAreaDeChat(estado, false);
        }

        async function criarPersonagem() {
            const dados = {
                nome: document.getElementById('nome').value || 'Aventureiro',
                idade: parseInt(document.getElementById('idade').value) || 20,
                genero: document.getElementById('genero').value || 'Indefinido',
                aparencia: document.getElementById('aparencia').value || 'Viajante comum',
                historico: document.getElementById('historico').value || 'Um viajante em busca de aventuras',
                ficha_completa: document.getElementById('ficha_completa').value || '',
                cenario: document.getElementById('cenario').value || '',
                personalidade_mestre: document.getElementById('personalidade_mestre').value || '',
                primeira_mensagem: document.getElementById('primeira_mensagem').value || '',
                dialogos_exemplo: document.getElementById('dialogos_exemplo').value || '',
                sistema_rpg: document.getElementById('sistema_rpg').checked,
                sistema_id: document.getElementById('sistema_id').value,
                d10_limiar_sucesso: parseInt(document.getElementById('d10_limiar_sucesso').value),
                d10_pontos_atributos: pontosD10(),
                d10_atributos_jogador: {
                    fisico: parseInt(document.getElementById('d10_atributo_fisico').value),
                    social: parseInt(document.getElementById('d10_atributo_social').value),
                    mental: parseInt(document.getElementById('d10_atributo_mental').value
                    )
                }
            };

            const resp = await fetch('/campanhas', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });

            if (!resp.ok) {
                alert('Erro ao criar personagem: ' + resp.status);
                return;
            }

            const estado = await resp.json();
            campanhaId = estado.campanha_id;
            localStorage.setItem(CHAVE_STORAGE, campanhaId);

            mostrarAreaDeChat(estado, true);
        }

        atualizarOpcoesD10();

        async function enviarMensagem() {
            const input = document.getElementById('mensagem');
            const msg = input.value.trim();
            if (!msg || !campanhaId) return;

            input.value = '';

            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg-user">${escapeHtml(msg)}</div>`;
            chat.scrollTop = chat.scrollHeight;

            document.getElementById('status').innerHTML = 'O Mestre está pensando...';

            try {
                const resp = await fetch(`/campanhas/${campanhaId}/acao`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mensagem: msg })
                });

                const dados = await resp.json();

                if (!resp.ok) {
                    chat.innerHTML += `<div class="msg-erro">Erro: ${dados.detail || resp.status}</div>`;
                    document.getElementById('status').innerHTML = 'Erro ao processar ação.';
                    return;
                }

                if (dados.teste) {
                    const t = dados.teste;
                    if (t.houve_teste) {
                        chat.innerHTML += `<div class="msg-teste">${escapeHtml(t.resumo_narrador)}</div>`;
                    }
                }

                chat.innerHTML += `<div class="msg-ia">${formatarNarracao(dados.resposta)}</div>`;

                if (dados.erro) {
                    chat.innerHTML += `<div class="msg-erro">Aviso técnico: ${dados.erro}</div>`;
                }

                chat.scrollTop = chat.scrollHeight;

                document.getElementById('status').innerHTML = `${dados.estado.estado.local} - ${dados.estado.estado.hora} | turno ${dados.estado.turno}`;
            } catch (e) {
                document.getElementById('status').innerHTML = 'Erro: ' + e.message;
            }
        }
    </script>
</body>
</html>
